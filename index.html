<style>
  :root{
    --p-950:#051F20;
    --p-900:#0B2B26;
    --p-800:#163832;
    --p-700:#235347;
    --p-300:#8EB69B;
    --p-100:#DAF1DE;
    --green:#235347;
    --green-deep:#0B2B26;
    --green-soft:#DAF1DE;
    --stripe:#8EB69B;
    --yellow:#F6C500;
    --red:#C81E1E;
    --ink:#12211D;
    --ink-soft:#5C6E67;
    --paper:#F5FAF6;
    --panel:#FFFFFF;
    --line:#E0EAE3;
    --amber:#C97A00;
    --orange:#D9531E;
    --gray:#8B8578;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.font-display{font-family:'Plus Jakarta Sans',sans-serif;}
  /* remove seta nativa de inputs com datalist */
  input[list]::-webkit-calendar-picker-indicator{ display:none !important; -webkit-appearance:none !important; }
  input[list]::-webkit-list-button{ display:none !important; -webkit-appearance:none !important; }
  .comb-bg{
    position:fixed; inset:0; z-index:-1; opacity:.05;
    background-image:
      radial-gradient(circle at 15% 20%, var(--p-700) 0, transparent 38%),
      radial-gradient(circle at 85% 75%, var(--p-300) 0, transparent 38%);
  }

  header{
    display:flex; flex-direction:row; align-items:center; justify-content:flex-start; gap:14px;
    padding:14px 22px;
    background:linear-gradient(180deg, var(--green) 0%, var(--green-deep) 100%);
    border-bottom:4px solid var(--stripe);
    position:relative;
  }
  .logo-img{ border-radius:14px; }
  header .logo-img{height:46px; width:auto; display:block;}
  header .backbtn{
    position:absolute; right:20px; top:50%; transform:translateY(-50%);
    background:rgba(255,255,255,.08); border:1.5px solid rgba(255,255,255,.25); color:#EAF2EC;
    padding:8px 14px; border-radius:9px; font-family:inherit; font-weight:600; font-size:13px;
    cursor:pointer; transition:.15s;
  }
  header .backbtn:hover{border-color:var(--yellow); color:var(--yellow); background:rgba(255,255,255,.14);}
  @media(max-width:560px){
    header{flex-wrap:wrap;}
    header .backbtn{position:static; transform:none; margin-left:auto;}
  }

  main{max-width:1080px; margin:0 auto; padding:44px 24px 80px;}

  /* ---------- LANDING ---------- */
  .landing-hero{text-align:center; margin-bottom:40px;}
  .landing-hero h1{
    font-weight:800; font-size:32px; margin:0; letter-spacing:-.5px; color:var(--ink);
  }
  .role-grid{display:flex; flex-direction:column; gap:16px; max-width:720px; margin:0 auto;}
  .role-card{
    background:var(--panel); border:1.5px solid var(--line); border-radius:18px;
    padding:26px 28px; text-align:left; cursor:pointer; transition:.2s;
    position:relative; overflow:hidden; box-shadow:0 1px 2px rgba(27,27,22,.03);
    display:flex; align-items:center; gap:26px; justify-content:space-between;
  }
  @media(max-width:640px){.role-card{flex-direction:column; align-items:flex-start; gap:14px;}}
  .role-card:hover{transform:translateY(-3px); box-shadow:0 16px 32px rgba(31,74,52,.12); border-color:var(--green);}
  .role-card .rc-main{flex:1; min-width:0;}
  .role-card .tag{
    display:inline-block; font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
    padding:5px 11px; border-radius:20px; margin-bottom:14px;
  }
  .role-card.req .tag{background:var(--green-soft); color:var(--green);}
  .role-card.stk .tag{background:#231F17; color:var(--yellow);}
  .role-card h2{font-weight:700; font-size:19px; margin:0 0 8px;}
  .role-card p{color:var(--ink-soft); font-size:13.5px; margin:0; line-height:1.55;}
  .role-card .go{font-weight:700; font-size:13.5px; color:var(--green); white-space:nowrap;}

  /* ---------- SHARED ---------- */
  .panel{background:var(--panel); border:1.5px solid var(--line); border-radius:20px; padding:28px; box-shadow:0 1px 2px rgba(27,27,22,.03); overflow:hidden;}
  h2.section-title{font-weight:700; font-size:20px; margin:0 0 4px;}
  .section-sub{color:var(--ink-soft); font-size:13.5px; margin:0 0 22px;}

  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-soft); margin-bottom:7px;}
  .field input, .field select, .field textarea{
    width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:12px;
    font-family:inherit; font-size:14.5px; background:#FCFBF8; color:var(--ink); transition:.15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--green); background:#fff; box-shadow:0 0 0 4px var(--green-soft);}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .row3{display:grid; grid-template-columns:1.4fr 1fr auto; gap:10px; align-items:end;}
  @media(max-width:640px){.row2,.row3{grid-template-columns:1fr;}}

  .item-row{display:grid; grid-template-columns:1fr 1.6fr .8fr auto; gap:10px; align-items:end; margin-bottom:10px;}
  @media(max-width:700px){.item-row{grid-template-columns:1fr;}}
  .item-row .rm{
    background:#FBE9E7; color:var(--red); border:none; border-radius:10px; width:40px; height:40px;
    font-size:16px; cursor:pointer; font-weight:700;
  }
  .add-item{
    background:none; border:1.5px dashed var(--line); color:var(--ink-soft); border-radius:12px;
    padding:11px; width:100%; font-family:inherit; font-weight:600; font-size:13.5px; cursor:pointer; margin-bottom:20px;
    transition:.15s;
  }
  .add-item:hover{border-color:var(--green); color:var(--green); background:var(--green-soft);}

  .btn{
    font-family:inherit; font-weight:700; font-size:14.5px; border:none; border-radius:12px;
    padding:14px 22px; cursor:pointer; transition:.15s;
  }
  .btn-primary{background:var(--green); color:#fff;}
  .btn-primary:hover{background:var(--green-deep);}
  .btn-primary:disabled{opacity:.5; cursor:not-allowed;}
  .btn-ghost{background:transparent; border:1.5px solid var(--line); color:var(--ink);}
  .btn-ghost:hover{border-color:var(--green); color:var(--green);}

  .toast{
    position:fixed; top:20px; left:50%; transform:translateX(-50%);
    background:var(--green-deep); color:#fff; padding:13px 22px; border-radius:12px;
    font-weight:600; font-size:14px; z-index:999; box-shadow:0 8px 24px rgba(0,0,0,.25);
    animation:fadein .2s ease-out;
  }
  @keyframes fadein{from{opacity:0; transform:translate(-50%,-8px);} to{opacity:1; transform:translate(-50%,0);}}

  /* login estoque */
  .login-box{max-width:380px; margin:50px auto 0; text-align:center;}
  .login-box .logo-img{height:46px; margin:0 auto 20px; display:block;}
  .login-box .field{text-align:left;}
  .error-msg{color:var(--red); font-size:13px; font-weight:600; margin-top:8px;}

  /* estoque dashboard */
  .kpis{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; margin-bottom:26px;}
  @media(max-width:700px){.kpis{grid-template-columns:1fr 1fr;}}
  .kpi{background:var(--panel); border:1.5px solid var(--line); border-radius:16px; padding:18px;}
  .kpi .num{font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:28px;}
  .kpi .lbl{font-size:12px; color:var(--ink-soft); font-weight:600; text-transform:uppercase; letter-spacing:.5px; margin-top:2px;}

  .tabs{display:flex; gap:6px; margin-bottom:20px; border-bottom:1.5px solid var(--line);}
  .tab-btn{
    background:none; border:none; padding:10px 16px; font-family:inherit; font-weight:700; font-size:14px;
    color:var(--ink-soft); cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-1.5px;
  }
  .tab-btn.active{color:var(--green); border-bottom-color:var(--green);}

  .filters{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px;}
  .filters select, .filters input{
    padding:9px 12px; border:1.5px solid var(--line); border-radius:10px; font-family:inherit; font-size:13.5px;
    min-width:0; box-sizing:border-box;
  }
  .filters input{flex:1 1 180px; min-width:120px;}
  .filters select{flex:1 1 130px;}
  @media(max-width:560px){
    .filters{flex-direction:column;}
    .filters select, .filters input{width:100%;}
  }
  #tableWrap{overflow-x:auto; -webkit-overflow-scrolling:touch;}

  table{width:100%; min-width:760px; border-collapse:collapse; font-size:13.5px;}
  th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-soft); padding:10px 12px; border-bottom:2px solid var(--line);}
  td{padding:12px; border-bottom:1px solid var(--line); vertical-align:top;}
  tr:hover td{background:rgba(35,83,71,.06);}
  .code-chip{font-family:monospace; font-weight:700; font-size:12.5px; background:#F2EEDF; padding:3px 7px; border-radius:6px; white-space:nowrap; display:inline-block;}
  .mini-open-btn{background:none; border:1.5px solid var(--line); color:var(--green); font-weight:700; font-size:11px; padding:3px 7px; border-radius:6px; cursor:pointer; white-space:nowrap;}
  .mini-open-btn:hover{border-color:var(--green); background:var(--p-100);}
  .acoes-x{background:#FBE9E7; color:var(--red); border:none; border-radius:50%; width:22px; height:22px; font-size:12px; font-weight:800; cursor:pointer; line-height:1; vertical-align:middle;}
  .acoes-pop{margin-top:8px; padding:8px; border:1.5px solid var(--line); border-radius:10px; background:#fff; display:flex; flex-direction:column; gap:6px; align-items:flex-start;}
  .acoes-pop button{background:none; border:none; color:var(--red); font-weight:700; font-size:12px; cursor:pointer; padding:0;}
  .acoes-pop button[data-trocar]{color:var(--ink-soft);}
  .badge{display:inline-block; font-size:11.5px; font-weight:700; padding:4px 9px; border-radius:20px;}
  .badge-foto{border-radius:9px; line-height:1.35; text-align:center; padding:5px 8px;}
  .badge-novo{background:#DDEBFF; color:#1D5FBF;}
  .badge-analise{background:#FFF3C4; color:#8A6A00;}
  .badge-separando{background:#FFE3CC; color:#B25A00;}
  .badge-semestoque{background:#F3E2E2; color:#A31E1E;}
  .badge-entregue{background:#DDF3E2; color:var(--green);}
  .badge-retirado{background:#EDE4FB; color:#6B3FC4;}
  .badge-cancelado{background:#F3E2E2; color:var(--red);}
  .prio-baixa{color:var(--gray);}
  .prio-media{color:var(--amber);}
  .prio-alta{color:var(--orange);}
  .prio-urgente{color:var(--red); font-weight:800;}
  select.status-select{padding:7px 8px; border-radius:8px; border:1.5px solid var(--line); font-family:inherit; font-size:12.5px; font-weight:600;}
  .del-link{background:none; border:none; color:var(--red); font-weight:700; cursor:pointer; font-size:12px; margin-top:8px;}
  .items-mini{font-size:12.5px; color:var(--ink-soft);}
  .items-mini div{margin-bottom:2px;}
  .empty-state{text-align:center; padding:50px 20px; color:var(--ink-soft);}

  .prod-grid{display:grid; grid-template-columns:1fr; gap:8px; margin-top:18px;}
  .prod-row{
    display:grid; grid-template-columns:120px 1fr 90px auto; gap:10px; align-items:center;
    padding:10px 12px; border:1.5px solid var(--line); border-radius:12px; font-size:13.5px;
  }
  @media(max-width:640px){.prod-row{grid-template-columns:1fr; gap:4px;}}
  .prod-row .del{background:none; border:none; color:var(--red); font-weight:700; cursor:pointer; font-size:13px; justify-self:end;}

  .req-layout{display:flex; gap:32px; align-items:flex-start; max-width:1000px; margin:0 auto;}
  .mine-list{width:300px; flex:none; margin-top:8px;}
  .mine-list .section-title{text-align:left;}
  .mine-card{
    border:1.5px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px;
    display:flex; flex-direction:column; align-items:flex-start; gap:8px;
    background:#fff;
  }
  @media(max-width:900px){
    .req-layout{flex-direction:column;}
    .req-scene{order:-1;}
    .mine-list{width:100%;}
  }

  /* ---------- CENA DO SOLICITANTE (estilo cartão com acentos) ---------- */
  .req-scene{position:relative; flex:1; min-width:0; max-width:600px; margin:0; padding:6px 0 0;}
  .req-card{border-radius:28px; padding:34px 32px; position:relative; z-index:2; box-shadow:0 24px 50px -12px rgba(11,43,38,.16);}
  .req-card .section-title, .req-card .section-sub{text-align:center;}
  .req-card .section-title{font-size:22px;}
  .req-decor{position:absolute; z-index:1; pointer-events:none;}
  .req-decor-1{width:80px; height:80px; border-radius:50%; background:var(--p-100); top:-26px; left:-34px;}
  .req-decor-2{width:44px; height:44px; border-radius:12px; background:var(--yellow); opacity:.85; bottom:-16px; right:-18px; transform:rotate(18deg);}
  .req-decor-3{width:22px; height:22px; border-radius:50%; border:4px solid var(--p-300); top:38%; right:-30px;}
  .req-decor-4{width:14px; height:14px; border-radius:4px; background:var(--red); opacity:.75; top:14px; right:-8px; transform:rotate(20deg);}
  @media(max-width:680px){ .req-decor{display:none;} }

  /* ---------- HUB DO ESTOQUE (sidebar) ---------- */
  .dash-shell{display:flex; gap:20px; align-items:flex-start;}
  .dash-sidebar{
    width:210px; flex:none; background:linear-gradient(165deg, var(--p-800) 0%, var(--p-950) 100%);
    border-radius:20px; padding:18px 14px; position:sticky; top:20px;
  }
  .dash-sidebar-title{color:#A9CDB6; font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; padding:6px 10px 14px;}
  .dash-nav-btn{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:none; border:none; color:#D9E9DD; font-family:inherit; font-weight:600; font-size:14px;
    padding:11px 12px; border-radius:12px; cursor:pointer; margin-bottom:4px; transition:.15s;
  }
  .dash-nav-btn:hover{background:rgba(255,255,255,.06);}
  .dash-nav-btn.active{background:var(--p-100); color:var(--p-900);}
  .dash-main{flex:1; min-width:0;}
  @media(max-width:820px){
    .dash-shell{flex-direction:column;}
    .dash-sidebar{width:100%; position:static; display:flex; gap:6px; padding:10px;}
    .dash-sidebar-title{display:none;}
    .dash-nav-btn{width:auto;}
  }

  .kpi{background:var(--panel); border:1.5px solid var(--line); border-radius:16px; padding:18px; position:relative;}
  .kpi-icon{
    width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-size:16px; margin-bottom:12px;
  }
  .import-row{display:flex; align-items:center; gap:12px; margin:2px 0 4px; flex-wrap:wrap;}
  .import-row .hint{font-size:12px; color:var(--ink-soft);}

  /* ---------- ABA DADOS ---------- */
  .stat-cards{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; margin-bottom:22px;}
  @media(max-width:700px){.stat-cards{grid-template-columns:1fr;}}
  .stat-card{background:var(--panel); border:1.5px solid var(--line); border-radius:16px; padding:18px;}
  .stat-card .num{font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:24px; color:var(--green);}
  .stat-card .lbl{font-size:12px; color:var(--ink-soft); font-weight:600; text-transform:uppercase; letter-spacing:.5px; margin-top:2px;}
  .rank-row{display:grid; grid-template-columns:120px 1fr 46px; gap:12px; align-items:center; margin-bottom:11px; font-size:13.5px;}
  .rank-row .rname{font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rank-bar-wrap{background:var(--green-soft); border-radius:8px; height:10px; overflow:hidden;}
  .rank-bar{background:var(--green); height:100%; border-radius:8px;}
  .rank-row .rval{text-align:right; font-weight:700; color:var(--ink-soft);}

  /* ---------- ABA CONFIGURAÇÕES ---------- */
  .cfg-section{margin-bottom:28px;}
  .cfg-section:last-child{margin-bottom:0;}
  .cfg-section h3{font-size:15px; font-weight:700; margin:0 0 4px;}
  .cfg-section .hint{font-size:13px; color:var(--ink-soft); margin:0 0 14px;}
  .acesso-row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .acesso-row:last-child{border-bottom:none;}
  #printArea{position:fixed; left:-9999px; top:0; width:800px;}
  @media print{
    body *{ visibility:hidden; }
    #printArea, #printArea *{ visibility:visible; }
    #printArea{ position:absolute; left:0; top:0; width:100%; }
  }

  /* ---------- CHAT DO CHAMADO ---------- */
  .chat-btn{
    position:relative; background:var(--green-soft); border:1.5px solid transparent; color:var(--green);
    width:36px; height:36px; border-radius:11px; font-size:16px; cursor:pointer; transition:.15s;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .chat-btn:hover{background:var(--p-100); border-color:var(--green);}
  .chat-dot{
    position:absolute; top:-3px; right:-3px; width:11px; height:11px; border-radius:50%;
    background:var(--red); border:2px solid var(--paper); box-shadow:0 0 0 1px var(--red);
  }
  .chat-backdrop{
    position:fixed; inset:0; background:rgba(11,43,38,.45); z-index:1000;
    display:flex; align-items:center; justify-content:center; padding:16px;
    animation:fadein .15s ease-out;
  }
  .chat-panel{
    width:440px; max-width:100%; height:min(640px,88vh); background:var(--panel); border-radius:22px;
    box-shadow:0 24px 60px rgba(0,0,0,.35); display:flex; flex-direction:column; overflow:hidden;
  }
  .chat-header{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:16px 18px; background:linear-gradient(180deg, var(--green) 0%, var(--green-deep) 100%); color:#fff; flex:none;
  }
  .chat-title{font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:15px; display:flex; align-items:center; gap:8px;}
  .chat-title .code-chip{background:rgba(255,255,255,.18); color:#fff;}
  .chat-sub{font-size:12px; color:#C8DFD0; margin-top:3px;}
  .chat-close{
    background:rgba(255,255,255,.12); border:none; color:#fff; width:30px; height:30px; border-radius:9px;
    font-size:14px; font-weight:700; cursor:pointer; flex:none;
  }
  .chat-close:hover{background:rgba(255,255,255,.22);}
  .chat-body{flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; background:var(--paper);}
  .chat-empty{margin:auto; text-align:center; color:var(--ink-soft); font-size:13.5px; max-width:220px;}
  .chat-msg{display:flex; max-width:100%;}
  .chat-msg.mine{justify-content:flex-end;}
  .chat-msg.other{justify-content:flex-start;}
  .chat-bubble{max-width:78%; padding:9px 13px; border-radius:16px; box-shadow:0 1px 2px rgba(27,27,22,.06);}
  .chat-msg.mine .chat-bubble{background:var(--green); color:#fff; border-bottom-right-radius:4px;}
  .chat-msg.other .chat-bubble{background:#fff; color:var(--ink); border:1.5px solid var(--line); border-bottom-left-radius:4px;}
  .chat-author{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; margin-bottom:3px; opacity:.75;}
  .chat-text{font-size:14px; line-height:1.42; white-space:pre-wrap; word-break:break-word;}
  .chat-time{font-size:10.5px; margin-top:5px; opacity:.65; text-align:right;}
  .chat-composer{display:flex; align-items:flex-end; gap:10px; padding:12px 14px; border-top:1.5px solid var(--line); background:#fff; flex:none;}
  .chat-composer textarea{
    flex:1; resize:none; max-height:110px; padding:10px 13px; border:1.5px solid var(--line); border-radius:14px;
    font-family:inherit; font-size:14px; background:#FCFBF8; color:var(--ink);
  }
  .chat-composer textarea:focus{outline:none; border-color:var(--green); background:#fff; box-shadow:0 0 0 4px var(--green-soft);}
  .chat-composer .btn{padding:12px 18px;}
  @media(max-width:520px){ .chat-panel{height:92vh; border-radius:16px;} }

  /* ---------- BANNER DE CONEXÃO ---------- */
  .conn-banner{
    position:sticky; top:0; z-index:500; background:#FDECEC; border-bottom:2px solid #E9A8A8;
    color:#8A1F1F; padding:10px 20px; font-size:13px; font-weight:700;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center; text-align:center;
  }
  .conn-banner .conn-detail{font-weight:500; opacity:.85; font-size:12px;}

  /* ---------- AÇÕES EM LOTE ---------- */
  .chk-linha, #selecionarTodos{ width:17px; height:17px; cursor:pointer; accent-color:var(--green); }
  .bulk-bar{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    background:var(--green-soft); border:1.5px solid var(--green); border-radius:14px;
    padding:11px 16px; margin-bottom:16px; animation:fadein .15s ease-out;
  }
  .bulk-bar .bulk-count{font-weight:800; color:var(--green-deep); font-size:13.5px; white-space:nowrap;}
  .bulk-bar select{padding:8px 10px; border:1.5px solid var(--line); border-radius:9px; font-family:inherit; font-size:13.5px; background:#fff;}
  .bulk-bar .btn{padding:9px 16px; font-size:13px;}
  .bulk-bar .bulk-hint{color:var(--ink-soft); font-size:11.5px; margin-left:auto;}
  @media(max-width:700px){ .bulk-bar{padding:11px;} .bulk-bar .bulk-hint{margin-left:0; width:100%;} }
</style>
</head>

/* identificador fixo deste navegador/aparelho, usado só para separar
   dados "privados" (ex: meus-ids) mesmo quando tudo está no Firebase */
function idDoAparelho(){
  try{
    let id = localStorage.getItem('apisflora_device_id');
    if(!id){ id = 'dev-' + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('apisflora_device_id', id); }
    return id;
  }catch(e){ return 'dev-sessao'; }
}

/* ---------------- camada de armazenamento (com fallback) ----------------
   Ordem de prioridade:
   1) Firebase Realtime Database (se FIREBASE_CONFIG estiver preenchido) —
      banco de verdade, compartilhado entre qualquer computador.
   2) window.storage (memória persistente do Claude, quando disponível).
   3) localStorage do navegador — só neste aparelho, como último recurso. */
const LS_PREFIX = 'apisflora_chamados__';
const temStorageNativo = () => (typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function');

function chaveFirebase(key, shared){
  return shared ? `shared/${key}` : `private/${idDoAparelho()}/${key}`;
}

let ultimoErroFirebase = null;
function atualizarBannerConexao(){
  const el = document.getElementById('connBanner');
  if(!el) return;
  if(ultimoErroFirebase){
    el.innerHTML = `<div class="conn-banner">⚠️ Sem conexão com o banco compartilhado — os dados deste computador podem NÃO estar sincronizando com os outros agora. <span class="conn-detail">(${esc(ultimoErroFirebase)})</span></div>`;
  } else {
    el.innerHTML = '';
  }
}

const db = {
  async get(key, shared){
    if(firebaseDB){
      try{
        const snap = await firebaseDB.ref(chaveFirebase(key, shared)).once('value');
        ultimoErroFirebase = null;
        atualizarBannerConexao();
        const val = snap.val();
        return val === null || val === undefined ? null : { key, value: val, shared };
      }catch(e){ ultimoErroFirebase = (e && e.message) || String(e); console.warn('Firebase get falhou, usando modo local:', e); atualizarBannerConexao(); }
    }
    if(temStorageNativo()){
      try{ return await window.storage.get(key, shared); }catch(e){ /* cai pro fallback */ }
    }
    try{
      const raw = localStorage.getItem(LS_PREFIX + key);
      return raw === null ? null : { key, value: raw, shared };
    }catch(e){ return null; }
  },
  async set(key, value, shared){
    if(firebaseDB){
      try{
        await firebaseDB.ref(chaveFirebase(key, shared)).set(value);
        ultimoErroFirebase = null;
        atualizarBannerConexao();
        return { key, value, shared };
      }catch(e){ ultimoErroFirebase = (e && e.message) || String(e); console.warn('Firebase set falhou, usando modo local:', e); atualizarBannerConexao(); }
    }
    if(temStorageNativo()){
      try{ return await window.storage.set(key, value, shared); }catch(e){ /* cai pro fallback */ }
    }
    try{
      localStorage.setItem(LS_PREFIX + key, value);
      return { key, value, shared };
    }catch(e){ return null; }
  }
};

/* ---------------- storage ---------------- */
function processarChamadosRaw(raw){
  if(raw === null || raw === undefined) return false;
  try{
    const parsed = typeof raw === 'string' ? JSON.parse(raw) : raw;
    if(Array.isArray(parsed)){ // formato antigo, migra
      state.chamados = parsed;
      state.chamadoSeq = parsed.length;
    } else {
      state.chamados = parsed.lista || [];
      state.chamadoSeq = parsed.seq || state.chamados.length;
    }
    return true;
  }catch(e){ return false; }
}
async function loadData(){
  try{
    const c = await db.get('chamados', true);
    if(c){
      if(!processarChamadosRaw(c.value)){ state.chamados = []; state.chamadoSeq = 0; }
    } else {
      state.chamados = [];
      state.chamadoSeq = 0;
    }
  }catch(e){ state.chamados = []; state.chamadoSeq = 0; }
  try{
    const m = await db.get('meus-ids', false);
    state.meusIds = m ? JSON.parse(m.value) : [];
  }catch(e){ state.meusIds = []; }
  try{
    const p = await db.get('produtos', true);
    state.produtos = p ? JSON.parse(p.value) : null;
  }catch(e){ state.produtos = null; }
  if(!state.produtos){
    state.produtos = { ...PRODUTOS_PADRAO_APIS_FLORA };
    await saveProdutos();
  }
  try{
    const s = await db.get('senha-estoque', true);
    state.senhaEstoque = s ? JSON.parse(s.value) : null;
  }catch(e){ state.senhaEstoque = null; }
  if(!state.senhaEstoque){
    state.senhaEstoque = SENHA_PADRAO_LOGISTICA;
    await db.set('senha-estoque', JSON.stringify(state.senhaEstoque), true);
  }
  try{
    const sc = await db.get('senha-config', true);
    state.senhaConfig = sc ? JSON.parse(sc.value) : null;
  }catch(e){ state.senhaConfig = null; }
  if(!state.senhaConfig){
    state.senhaConfig = SENHA_PADRAO_CONFIG;
    await db.set('senha-config', JSON.stringify(state.senhaConfig), true);
  }
  try{
    const se = await db.get('senha-excluir', true);
    state.senhaExcluir = se ? JSON.parse(se.value) : null;
  }catch(e){ state.senhaExcluir = null; }
  if(!state.senhaExcluir){
    state.senhaExcluir = SENHA_PADRAO_EXCLUIR;
    await db.set('senha-excluir', JSON.stringify(state.senhaExcluir), true);
  }
  try{
    const a = await db.get('acessos-estoque', true);
    state.acessos = a ? JSON.parse(a.value) : [];
  }catch(e){ state.acessos = []; }
  state.loading = false;
}
async function refreshChamados(){
  try{
    const c = await db.get('chamados', true);
    if(c) processarChamadosRaw(c.value);
  }catch(e){ /* mantém o que já tinha */ }
}
async function saveChamados(){
  await db.set('chamados', JSON.stringify({ seq: state.chamadoSeq, lista: state.chamados }), true);
}

/* ---------------- tempo real (Firebase) ---------------- */
let chamadosListenerAtivo = false;
function iniciarListenerChamados(){
  if(!firebaseDB || chamadosListenerAtivo) return;
  chamadosListenerAtivo = true;
  firebaseDB.ref(chaveFirebase('chamados', true)).on('value', snap => {
    if(state.loading) return; // ainda no carregamento inicial via loadData()
    ultimoErroFirebase = null;
    atualizarBannerConexao();
    const mudou = processarChamadosRaw(snap.val());
    if(mudou) aoAtualizarChamadosAoVivo();
  }, err => {
    ultimoErroFirebase = (err && err.message) || String(err);
    console.warn('Listener de chamados falhou, caindo para atualização periódica:', err);
    atualizarBannerConexao();
    chamadosListenerAtivo = false;
  });
}
/* re-renderiza só o que precisa, sem atrapalhar quem está digitando (busca, filtros de data) */
function aoAtualizarChamadosAoVivo(){
  if(state.chatAberto){
    const existe = state.chamados.find(x => x.id === state.chatAberto.chamadoId);
    if(existe){ renderChatMensagens(); marcarChatLido(state.chatAberto.chamadoId, state.chatAberto.role); }
    else { fecharChat(); }
  }
  if(state.screen === 'solicitante'){
    renderMineList();
  } else if(state.screen === 'estoque'){
    if(state.estoqueTab === 'painel'){
      const buscaFocada = document.activeElement && document.activeElement.id === 'busca';
      if(buscaFocada) renderTable(); // atualiza só as linhas, preserva o que está sendo digitado
      else renderEstoque(document.getElementById('app')); // atualiza KPIs + tabela por completo
    } else if(state.estoqueTab === 'avaliacao'){
      renderAvaliacaoTab();
    } else if(state.estoqueTab === 'dados'){
      const digitandoData = document.activeElement && ['fPeriodoDe','fPeriodoAte'].includes(document.activeElement.id);
      if(!digitandoData) renderDadosTab();
    }
  } else if(state.screen === 'estoque-detalhe'){
    renderDetalheChamado(document.getElementById('app'));
  }
  atualizarPontosChat();
}
/* modo de contingência (Firebase indisponível): verifica periodicamente */
setInterval(async () => {
  if(firebaseDB && chamadosListenerAtivo) return; // já está em tempo real via listener
  const emPainel = state.screen === 'estoque' && state.estoqueTab === 'painel';
  const emSolicitante = state.screen === 'solicitante';
  const chatAberto = !!state.chatAberto;
  if(!emPainel && !emSolicitante && !chatAberto) return;
  const antesLen = state.chamados.length;
  await refreshChamados();
  if(chatAberto){
    marcarChatLido(state.chatAberto.chamadoId, state.chatAberto.role);
    renderChatMensagens();
  }
  if(emPainel){
    const buscaFocada = document.activeElement && document.activeElement.id === 'busca';
    if(buscaFocada) renderTable(); else if(antesLen !== state.chamados.length) renderEstoque(document.getElementById('app'));
  }
  if(emSolicitante) renderMineList();
  atualizarPontosChat();
}, 4000);

/* ---------------- util ---------------- */
function proximoCodigo(){
  state.chamadoSeq += 1;
  return `APF-${String(state.chamadoSeq).padStart(4,'0')}`;
}
function fmtData(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function fmtDataHora(isoCompleto){
  if(!isoCompleto) return '—';
  const dt = new Date(isoCompleto);
  if(isNaN(dt.getTime())) return '—';
  const d = String(dt.getDate()).padStart(2,'0');
  const m = String(dt.getMonth()+1).padStart(2,'0');
  const y = dt.getFullYear();
  const hh = String(dt.getHours()).padStart(2,'0');
  const mm = String(dt.getMinutes()).padStart(2,'0');
  return `${d}/${m}/${y} ${hh}:${mm}`;
}
function comprimirImagem(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Falha ao ler o arquivo'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Falha ao carregar a imagem'));
      img.onload = () => {
        const MAX = 900;
        let { width, height } = img;
        if(width > height && width > MAX){ height = Math.round(height * MAX / width); width = MAX; }
        else if(height > MAX){ width = Math.round(width * MAX / height); height = MAX; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function abrirFotoEntrega(c){
  const win = window.open('', '_blank');
  if(!win){ toast('Permita pop-ups para ver a foto.'); return; }
  win.document.write(`

function badgeClass(status){
  return {
    'Novo':'badge-novo','Em análise':'badge-analise','Separando':'badge-separando','Sem Estoque':'badge-semestoque',
    'Entregue':'badge-entregue','Retirado do sistema':'badge-retirado','Cancelado':'badge-cancelado'
  }[status] || 'badge-novo';
}
function prioClass(p){
  return {'Baixa':'prio-baixa','Média':'prio-media','Alta':'prio-alta','Urgente':'prio-urgente'}[p] || '';
}
const STATUS_FINALIZADOS = ['Entregue','Retirado do sistema','Cancelado'];
function isAtrasado(c){
  if(STATUS_FINALIZADOS.includes(c.status)) return false;
  if(!c.dataNecessaria) return false;
  return new Date(c.dataNecessaria + 'T23:59:59') < new Date();
}
function exportarExcel(planilhas, filename){
  if(typeof XLSX === 'undefined'){ toast('Não consegui carregar o gerador de planilhas.'); return; }
  const wb = XLSX.utils.book_new();
  planilhas.forEach(p => {
    const ws = XLSX.utils.json_to_sheet(p.linhas);
    XLSX.utils.book_append_sheet(wb, ws, p.nome.slice(0,31));
  });
  XLSX.writeFile(wb, filename);
  toast('Planilha exportada.');
}
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2600);
}
function esc(s){ const d=document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

/* ---------------- CHAT DO CHAMADO ---------------- */
function chatLastSeenKey(role, chamadoId){ return `apisflora_chat_lastseen__${role}__${chamadoId}`; }
function marcarChatLido(chamadoId, role){
  try{ localStorage.setItem(chatLastSeenKey(role, chamadoId), new Date().toISOString()); }catch(e){}
}
function temMensagemNaoLida(c, role){
  if(!c || !Array.isArray(c.mensagens) || c.mensagens.length === 0) return false;
  let lastSeen = null;
  try{ lastSeen = localStorage.getItem(chatLastSeenKey(role, c.id)); }catch(e){}
  return c.mensagens.some(m => m.autor !== role && (!lastSeen || m.em > lastSeen));
}
function atualizarPontosChat(){
  document.querySelectorAll('[data-chat]').forEach(btn=>{
    const id = btn.dataset.chat;
    const role = btn.dataset.chatRole;
    const c = state.chamados.find(x=>x.id === id);
    const jaTemDot = !!btn.querySelector('.chat-dot');
    const precisaDot = c ? temMensagemNaoLida(c, role) : false;
    if(precisaDot && !jaTemDot){
      const dot = document.createElement('span');
      dot.className = 'chat-dot';
      btn.appendChild(dot);
    } else if(!precisaDot && jaTemDot){
      btn.querySelector('.chat-dot').remove();
    }
  });
}
function abrirChat(chamadoId, role){
  state.chatAberto = { chamadoId, role };
  marcarChatLido(chamadoId, role);
  renderChatOverlay();
  atualizarPontosChat();
}
function fecharChat(){
  state.chatAberto = null;
  const overlay = document.getElementById('chatOverlay');
  if(overlay) overlay.innerHTML = '';
  atualizarPontosChat();
}
function renderChatOverlay(){
  const overlay = document.getElementById('chatOverlay');
  if(!overlay || !state.chatAberto) return;
  const { chamadoId, role } = state.chatAberto;
  const c = state.chamados.find(x => x.id === chamadoId);
  if(!c){ state.chatAberto = null; overlay.innerHTML = ''; toast('Chamado não encontrado.'); return; }
  overlay.innerHTML = `
    <div class="chat-backdrop" id="chatBackdrop">
      <div class="chat-panel">
        <div class="chat-header">
          <div>
            <div class="chat-title">💬 Conversa <span class="code-chip">${c.id}</span></div>
            <div class="chat-sub">${esc(c.setor)} · ${esc(c.nome)}</div>
          </div>
          <button class="chat-close" id="chatCloseBtn" title="Fechar">✕</button>
        </div>
        <div class="chat-body" id="chatBody"></div>
        <div class="chat-composer">
          <textarea id="chatInput" placeholder="Escreva uma mensagem…" rows="1"></textarea>
          <button class="btn btn-primary" id="chatSendBtn">Enviar</button>
        </div>
      </div>
    </div>
  `;
  renderChatMensagens();
  document.getElementById('chatCloseBtn').onclick = fecharChat;
  document.getElementById('chatBackdrop').onclick = e => { if(e.target.id === 'chatBackdrop') fecharChat(); };
  const input = document.getElementById('chatInput');
  input.oninput = () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 110) + 'px'; };
  const enviar = async () => {
    const texto = input.value.trim();
    if(!texto) return;
    const cAgora = state.chamados.find(x => x.id === chamadoId);
    if(!cAgora){ toast('Chamado não encontrado.'); return; }
    cAgora.mensagens = cAgora.mensagens || [];
    cAgora.mensagens.push({ autor: role, texto, em: new Date().toISOString() });
    input.value = '';
    input.style.height = 'auto';
    renderChatMensagens();
    marcarChatLido(chamadoId, role);
    await saveChamados();
  };
  document.getElementById('chatSendBtn').onclick = enviar;
  input.onkeydown = e => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); enviar(); } };
  input.focus();
}
function renderChatMensagens(){
  const body = document.getElementById('chatBody');
  if(!body || !state.chatAberto) return;
  const { chamadoId, role } = state.chatAberto;
  const c = state.chamados.find(x => x.id === chamadoId);
  if(!c) return;
  const msgs = c.mensagens || [];
  body.innerHTML = msgs.length === 0
    ? `<div class="chat-empty">Nenhuma mensagem ainda neste chamado.<br>Escreva a primeira mensagem abaixo.</div>`
    : msgs.map(m => `
      <div class="chat-msg ${m.autor === role ? 'mine' : 'other'}">
        <div class="chat-bubble">
          <div class="chat-author">${m.autor === 'logistica' ? '📦 Logística' : '🙋 Solicitante'}</div>
          <div class="chat-text">${esc(m.texto)}</div>
          <div class="chat-time">${fmtDataHora(m.em)}</div>
        </div>
      </div>
    `).join('');
  body.scrollTop = body.scrollHeight;
}

  if(state.screen === 'estoque') return renderEstoque(app);
  if(state.screen === 'estoque-detalhe') return renderDetalheChamado(app);
}

function mascaraDataBR(el){
  let v = el.value.replace(/\D/g,'').slice(0,8);
  if(v.length >= 5) v = v.slice(0,2) + '/' + v.slice(2,4) + '/' + v.slice(4);
  else if(v.length >= 3) v = v.slice(0,2) + '/' + v.slice(2);
  el.value = v;
}
function dataBRparaISO(str){
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec((str||'').trim());
  if(!m) return null;
  const [, d, mo, y] = m;
  const dt = new Date(`${y}-${mo}-${d}T00:00:00`);
  if(isNaN(dt.getTime()) || dt.getDate() !== parseInt(d,10) || (dt.getMonth()+1) !== parseInt(mo,10)) return null;
  return `${y}-${mo}-${d}`;
}

      if(focusEl){ focusEl.focus(); focusEl.setSelectionRange(focusEl.value.length, focusEl.value.length); }
    };
  });
  wrap.querySelectorAll('.qtdInput').forEach(inp=>{
    inp.oninput = e => state.formItems[+e.target.dataset.i].quantidade = e.target.value;

  wrap.querySelectorAll('.rm').forEach(btn=>{

async function submitChamado(){
  const nome = (document.getElementById('fNome').value || '').trim();
  const setor = (document.getElementById('fSetor').value || '').trim().toUpperCase();
  const prio = document.getElementById('fPrio').value;
  const dataBR = document.getElementById('fData').value;
  const data = dataBRparaISO(dataBR);

  if(!nome || !setor || !dataBR){ toast('Preencha nome, setor e data.'); return; }
  if(!SETORES_VALIDOS.includes(setor)){ toast('Selecione um setor válido da lista.'); return; }
  if(!data){ toast('Data inválida. Use o formato dd/mm/aaaa.'); return; }
  const hojeISO = new Date().toISOString().slice(0,10);
  if(data < hojeISO){ toast('A data não pode ser anterior a hoje.'); return; }
  const itensValidos = state.formItems
    .map(it => ({ codigo: it.codigo.trim().toUpperCase(), quantidade: it.quantidade }))
    .filter(it => it.codigo && it.quantidade);
  if(itensValidos.length === 0){ toast('Adicione ao menos um item com código e quantidade.'); return; }

  const itensFinal = itensValidos.map(it => {
    const prod = state.produtos[it.codigo];
    return { codigo: it.codigo, material: prod ? prod.nome : '(código não cadastrado)', unidade: prod ? prod.unidade : '', quantidade: it.quantidade };
  });

  const chamado = {
    id: proximoCodigo(),
    nome, setor, prioridade: prio, dataNecessaria: data,
    itens: itensFinal,
    status: 'Novo',
    criadoEm: new Date().toISOString(),
    historico: [{ status:'Novo', em: new Date().toISOString() }],
    mensagens: []
  };

  const btn = document.getElementById('enviarBtn');
  btn.disabled = true; btn.textContent = 'Enviando…';
  state.chamados.unshift(chamado);
  await saveChamados();
  await salvarMeuId(chamado.id);

  toast(`Chamado ${chamado.id} enviado!`);
  state.formItems = [{ codigo:'', quantidade:'' }];
  state._prio = prio; // mantém prioridade/setor para agilizar próximo pedido
  render();
}

        <tr><td style="padding:4px 8px; border:1px solid #999; font-weight:bold;">Solicitante</td><td style="padding:4px 8px; border:1px solid #999;">${esc(c.nome)}</td></tr>
        <tr><td style="padding:4px 8px; border:1px solid #999; font-weight:bold;">Data do pedido</td><td style="padding:4px 8px; border:1px solid #999;">${fmtDataHora(c.criadoEm)}</td></tr>
        <tr><td style="padding:4px 8px; border:1px solid #999; font-weight:bold;">Precisa ser entregue até</td><td style="padding:4px 8px; border:1px solid #999;">${fmtData(c.dataNecessaria)}</td></tr>
        <tr><td style="padding:4px 8px; border:1px solid #999; font-weight:bold;">Prioridade</td><td style="padding:4px 8px; border:1px solid #999;">${esc(c.prioridade)}</td></tr>
      </table>
      <table style="width:100%; border-collapse:collapse; font-size:13px;">
        <thead>
          <tr>
            <th style="padding:6px 8px; border:1px solid #999; background:#eee;">Nº</th>
            <th style="padding:6px 8px; border:1px solid #999; background:#eee;">Código</th>
            <th style="padding:6px 8px; border:1px solid #999; background:#eee;">Material</th>
            <th style="padding:6px 8px; border:1px solid #999; background:#eee;">Quantidade</th>
            <th style="padding:6px 8px; border:1px solid #999; background:#eee;">Lote</th>
          </tr>
        </thead>
        <tbody>
          ${c.itens.map((it,i) => `
            <tr>
              <td style="padding:10px 8px; border:1px solid #999; text-align:center;">${i+1}</td>
              <td style="padding:10px 8px; border:1px solid #999;">${esc(it.codigo)}</td>
              <td style="padding:10px 8px; border:1px solid #999;">${esc(it.material)}</td>

            </tr>
          `).join('')}
        </tbody>
      </table>
      <div style="margin-top:30px; font-size:12px; display:flex; justify-content:space-between;">
        <div>Separado por: _____________________</div>
        <div>Data: ____/____/______</div>
      </div>
    </div>
  `;
  window.print();
}

/* ---------------- ESTOQUE DASHBOARD ---------------- */
function renderEstoque(app){
  const total = state.chamados.length;
  const atrasados = state.chamados.filter(isAtrasado).length;
  const iconesStatus = {
    'Novo':{ic:'🆕',bg:'#DDEBFF',fg:'#1D5FBF'},
    'Em análise':{ic:'🔎',bg:'#FFF3C4',fg:'#8A6A00'},
    'Separando':{ic:'📦',bg:'#FFE3CC',fg:'#B25A00'},
    'Sem Estoque':{ic:'🚫',bg:'#F3E2E2',fg:'#A31E1E'},
    'Entregue':{ic:'✅',bg:'var(--p-100)',fg:'var(--p-700)'},
    'Retirado do sistema':{ic:'📤',bg:'#EDE4FB',fg:'#6B3FC4'},
    'Cancelado':{ic:'❌',bg:'#F3E2E2',fg:'var(--red)'}
  };

  app.innerHTML = `
    <div class="dash-shell">
      <aside class="dash-sidebar">
        <div class="dash-sidebar-title">Logística</div>
        <button class="dash-nav-btn ${state.estoqueTab==='painel'?'active':''}" id="tabPainel">📋 &nbsp;Chamados</button>
        <button class="dash-nav-btn ${state.estoqueTab==='avaliacao'?'active':''}" id="tabAvaliacao">⭐ &nbsp;Avaliação</button>
        <button class="dash-nav-btn ${state.estoqueTab==='dados'?'active':''}" id="tabDados">📊 &nbsp;Dados</button>
        <button class="dash-nav-btn ${state.estoqueTab==='config'?'active':''}" id="tabConfig">⚙️ &nbsp;Configurações</button>
      </aside>
      <div class="dash-main">
        ${state.estoqueTab==='painel' ? `
        <div class="kpis">
          <div class="kpi"><div class="kpi-icon" style="background:var(--p-100); color:var(--p-700);">🗂️</div><div class="num">${total}</div><div class="lbl">Total de chamados</div></div>
          ${atrasados > 0 ? `<div class="kpi" style="border-color:var(--red);"><div class="kpi-icon" style="background:#F3E2E2; color:var(--red);">⚠️</div><div class="num" style="color:var(--red);">${atrasados}</div><div class="lbl">Atrasados</div></div>` : ''}
          ${STATUS_LIST.map(s => {
            const qtd = state.chamados.filter(c=>c.status===s).length;
            const ic = iconesStatus[s] || {ic:'•',bg:'var(--p-100)',fg:'var(--p-700)'};
            return `<div class="kpi"><div class="kpi-icon" style="background:${ic.bg}; color:${ic.fg};">${ic.ic}</div><div class="num" style="color:${ic.fg};">${qtd}</div><div class="lbl">${esc(s)}</div></div>`;
          }).join('')}
        </div>` : ''}
        <div id="tabContent"></div>
      </div>
    </div>
  `;
  document.getElementById('tabPainel').onclick = () => { state.estoqueTab='painel'; render(); };
  document.getElementById('tabAvaliacao').onclick = () => { state.selecionados.clear(); state.estoqueTab='avaliacao'; render(); };
  document.getElementById('tabDados').onclick = () => { state.selecionados.clear(); state.estoqueTab='dados'; render(); };
  document.getElementById('tabConfig').onclick = () => { state.selecionados.clear(); state.estoqueTab='config'; state._cfgErr=false; render(); };

  if(state.estoqueTab === 'painel') renderPainelChamados();
  else if(state.estoqueTab === 'avaliacao') renderAvaliacaoTab();
  else if(state.estoqueTab === 'dados') renderDadosTab();
  else renderConfigTab();
}

function renderPainelChamados(){
  const wrap = document.getElementById('tabContent');
  wrap.innerHTML = `
    <div class="panel">
      <div class="filters">
        <input id="busca" placeholder="Buscar por código, nome ou setor…" value="${esc(state.filtro.busca)}">
        <select id="fStatus">
          <option value="todos" ${state.filtro.status==='todos'?'selected':''}>Todos os status</option>
          ${STATUS_LIST.map(s=>`<option ${state.filtro.status===s?'selected':''}>${s}</option>`).join('')}
        </select>
        <select id="fPrioF">
          <option value="todas" ${state.filtro.prioridade==='todas'?'selected':''}>Todas prioridades</option>
          ${PRIORIDADES.map(p=>`<option ${state.filtro.prioridade===p?'selected':''}>${p}</option>`).join('')}
        </select>
      </div>
      <p class="hint" style="margin:-4px 0 16px;">📌 Para mudar o status de um chamado para <strong>Entregue</strong>, é obrigatório anexar a foto da entrega.</p>
      <div id="bulkBar"></div>
      <div id="tableWrap"></div>
    </div>
  `;
  document.getElementById('busca').oninput = e => { state.filtro.busca = e.target.value; renderTable(); };
  document.getElementById('fStatus').onchange = e => { state.filtro.status = e.target.value; renderTable(); };
  document.getElementById('fPrioF').onchange = e => { state.filtro.prioridade = e.target.value; renderTable(); };
  renderTable();
}

function renderTable(){
  const tw = document.getElementById('tableWrap');
  const busca = state.filtro.busca.trim().toLowerCase();
  let list = state.chamados.filter(c => {
    if(state.filtro.status !== 'todos' && c.status !== state.filtro.status) return false;
    if(state.filtro.prioridade !== 'todas' && c.prioridade !== state.filtro.prioridade) return false;
    if(busca){
      const hay = (c.id + ' ' + c.setor + ' ' + c.nome + ' ' + c.itens.map(i=>i.codigo+' '+i.material).join(' ')).toLowerCase();
      if(!hay.includes(busca)) return false;
    }
    return true;
  });

  // remove da seleção ids que não existem mais (excluídos por outro dispositivo, etc.)
  const idsExistentes = new Set(state.chamados.map(c=>c.id));
  Array.from(state.selecionados).forEach(id => { if(!idsExistentes.has(id)) state.selecionados.delete(id); });

  if(list.length === 0){
    tw.innerHTML = `<div class="empty-state">Nenhum chamado encontrado com esses filtros.</div>`;
    renderBulkBar(list);
    return;
  }

  tw.innerHTML = `
    <table>
      <thead><tr>
        <th style="width:30px;"><input type="checkbox" id="selecionarTodos" title="Selecionar todos os chamados visíveis"></th>
        <th>Chamado</th><th>Chat</th><th>Solicitante / Setor</th><th>Itens</th><th>Prioridade</th><th>Entrega</th><th>Status</th><th>Ações</th>
      </tr></thead>
      <tbody>
        ${list.map(c => {
          const atrasado = isAtrasado(c);
          return `
          <tr style="${atrasado ? 'background:#FDEDED;' : ''}">
            <td><input type="checkbox" class="chk-linha" data-id="${c.id}" ${state.selecionados.has(c.id)?'checked':''}></td>
            <td>
              <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                <button class="mini-open-btn" data-abrir="${c.id}">🔍 Abrir</button>
                <span class="code-chip">${c.id}</span>
              </div>
              <div style="font-size:11.5px; color:var(--ink-soft); margin-top:5px;">${fmtDataHora(c.criadoEm)}</div>
            </td>
            <td>

function atualizarEstadoSelecaoTodos(list){
  const el = document.getElementById('selecionarTodos');

  const todos = list.length > 0 && list.every(c => state.selecionados.has(c.id));
  const alguns = list.some(c => state.selecionados.has(c.id));
  el.checked = todos;
  el.indeterminate = alguns && !todos;
}
function renderBulkBar(list){

  bar.innerHTML = `

    </div>
  `;

  sel.onchange = () => { aplicarBtn.disabled = !sel.value; };
  aplicarBtn.onclick = async () => {
    const novoStatus = sel.value;
    if(!novoStatus) return;
    const idsAlvo = Array.from(state.selecionados);
    if(!confirm(`Mudar o status de ${idsAlvo.length} chamado(s) para "${novoStatus}"?`)) return;
    const agora = new Date().toISOString();
    let alterados = 0;
    state.chamados.forEach(c => {
      if(state.selecionados.has(c.id)){
        c.status = novoStatus;
        c.historico = c.historico || [];
        c.historico.push({ status: novoStatus, em: agora });
        alterados++;

    aplicarBtn.disabled = true; aplicarBtn.textContent = 'Aplicando…';

    toast(`${alterados} chamado(s) atualizados para "${novoStatus}".`);
    state.selecionados.clear();

    renderEstoque(document.getElementById('app'));
  };
}

function normalizeHeader(h){
  return String(h||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();
}

async function handleImportPlanilha(file, containerId){
  if(typeof XLSX === 'undefined'){ toast('Não consegui carregar o leitor de planilhas.'); return; }
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' });
    if(!rows || rows.length < 2){ toast('Planilha vazia ou sem dados.'); return; }

    const headers = rows[0].map(normalizeHeader);
    let idxCodigo = headers.findIndex(h => h.includes('codigo') || h === 'cod' || h.includes('nº') || h.includes('numero'));
    if(idxCodigo === -1){
      idxCodigo = headers.findIndex(h => h.includes('item') && !h.includes('descri') && !h.includes('nome'));
    }
    const idxNome = headers.findIndex(h => h.includes('nome') || h.includes('produto') || h.includes('material') || h.includes('descricao'));
    const idxUnidade = headers.findIndex(h => h.includes('unidade') || h === 'un' || h === 'uni' || h.includes('medida'));

    if(idxCodigo === -1 || idxNome === -1){
      toast('Não encontrei colunas de código e nome na planilha.');
      return;
    }

    let count = 0;
    for(let i=1; i<rows.length; i++){
      const row = rows[i];
      const codigo = String(row[idxCodigo] ?? '').trim().toUpperCase();
      const nome = String(row[idxNome] ?? '').trim();
      const unidade = idxUnidade >= 0 ? String(row[idxUnidade] ?? '').trim() : '';
      if(!codigo || !nome) continue;
      state.produtos[codigo] = { nome, unidade };
      count++;
    }
    await saveProdutos();
    toast(`${count} produto${count===1?'':'s'} importado${count===1?'':'s'}.`);
    renderProdutosTab(containerId);
  }catch(err){
    toast('Não consegui ler essa planilha. Confira o arquivo.');
  }
}

function filtrarChamadosPorPeriodo(lista){
  const f = state.filtroDados;
  if(!f || f.periodo === 'todos') return lista;
  if(f.periodo === 'semana'){
    const inicio = new Date(); inicio.setDate(inicio.getDate()-6); inicio.setHours(0,0,0,0);
    return lista.filter(c => c.criadoEm && new Date(c.criadoEm) >= inicio);
  }
  if(f.periodo === 'mes'){
    const agora = new Date();
    const inicio = new Date(agora.getFullYear(), agora.getMonth(), 1, 0,0,0,0);
    return lista.filter(c => c.criadoEm && new Date(c.criadoEm) >= inicio);
  }
  if(f.periodo === 'personalizado'){
    return lista.filter(c => {
      if(!c.criadoEm) return false;
      const d = c.criadoEm.slice(0,10);
      if(f.de && d < f.de) return false;
      if(f.ate && d > f.ate) return false;
      return true;
    });
  }
  return lista;
}

  return 'Todos os períodos';
}

    <div class="stat-cards">
      <div class="stat-card"><div class="num">${chamadosF.length}</div><div class="lbl">Chamados ${f.periodo==='todos'?'no total':'no período'}</div></div>
      <div class="stat-card"><div class="num">${totalItens}</div><div class="lbl">Itens solicitados ${f.periodo==='todos'?'no total':'no período'}</div></div>
      <div class="stat-card"><div class="num" style="color:var(--red);">${urgentes}</div><div class="lbl">Chamados urgentes</div></div>
    </div>
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:8px;">
      <span style="font-size:12.5px; color:var(--ink-soft);">Mostrando: <strong>${esc(periodoLabel())}</strong></span>
      <button class="btn btn-ghost" id="exportarDadosBtn">⬇ Exportar período em Excel</button>
    </div>
    <div class="panel" style="margin-bottom:16px;">
      <h2 class="section-title" style="font-size:16px;">Setores que mais pedem</h2>
      <p class="section-sub">Número de chamados abertos por setor / centro de custo.</p>
      ${rankSetores.length===0 ? '<div class="empty-state">Nenhum chamado nesse período.</div>' : rankSetores.map(([setor,qtd])=>`
        <div class="rank-row">
          <span class="rname">${esc(setor)}</span>
          <span class="rank-bar-wrap"><span class="rank-bar" style="width:${Math.round(qtd/maxSetor*100)}%;"></span></span>
          <span class="rval">${qtd}</span>
        </div>
      `).join('')}
    </div>
    <div class="panel">
      <h2 class="section-title" style="font-size:16px;">Itens mais pedidos</h2>
      <p class="section-sub">Soma das quantidades solicitadas por material.</p>
      ${rankItens.length===0 ? '<div class="empty-state">Nenhum chamado nesse período.</div>' : rankItens.map(([item,qtd])=>`
        <div class="rank-row">
          <span class="rname">${esc(item)}</span>
          <span class="rank-bar-wrap"><span class="rank-bar" style="width:${Math.round(qtd/maxItem*100)}%;"></span></span>
          <span class="rval">${qtd}</span>
        </div>
      `).join('')}
    </div>
  `;
  document.getElementById('fPeriodo').onchange = e => {
    state.filtroDados.periodo = e.target.value;
    if(e.target.value !== 'personalizado'){ state.filtroDados.de=''; state.filtroDados.ate=''; state.filtroDados.deBR=''; state.filtroDados.ateBR=''; }
    renderDadosTab();
  };
  const deInp = document.getElementById('fPeriodoDe');
  const ateInp = document.getElementById('fPeriodoAte');
  if(deInp){
    deInp.oninput = e => { mascaraDataBR(e.target); state.filtroDados.deBR = e.target.value; };
    deInp.onblur = e => { state.filtroDados.de = dataBRparaISO(e.target.value) || ''; renderDadosTab(); };
    deInp.onkeydown = e => { if(e.key==='Enter') e.target.blur(); };
  }
  if(ateInp){
    ateInp.oninput = e => { mascaraDataBR(e.target); state.filtroDados.ateBR = e.target.value; };
    ateInp.onblur = e => { state.filtroDados.ate = dataBRparaISO(e.target.value) || ''; renderDadosTab(); };
    ateInp.onkeydown = e => { if(e.key==='Enter') e.target.blur(); };
  }
  const exportarDadosBtn = document.getElementById('exportarDadosBtn');
  if(exportarDadosBtn){
    exportarDadosBtn.onclick = () => {
      const linhasChamados = chamadosF.map(c => ({
        'Chamado': c.id,
        'Solicitante': c.nome,
        'Setor': c.setor,
        'Itens': c.itens.map(it=>`${it.quantidade}${it.unidade?' '+it.unidade:''} - ${it.material} (${it.codigo})`).join('; '),
        'Prioridade': c.prioridade,
        'Data pedida': fmtData(c.dataNecessaria),
        'Status': c.status,
        'Atrasado': isAtrasado(c) ? 'Sim' : 'Não',
        'Criado em': fmtDataHora(c.criadoEm),
        'Entregue em': c.entregueEm ? fmtDataHora(c.entregueEm) : ''
      }));
      const avaliados = chamadosF.filter(c => c.status === 'Entregue' && c.entregueEm);
      const linhasAvaliacao = avaliados.map(c => {
        const atrasado = new Date(c.entregueEm) > new Date(c.dataNecessaria + 'T23:59:59');
        return {
          'Chamado': c.id, 'Setor': c.setor, 'Pedido para': fmtData(c.dataNecessaria),
          'Entregue em': fmtDataHora(c.entregueEm), 'Resultado': atrasado ? 'Fora do prazo' : 'No prazo'
        };
      });
      const sufixoPeriodo = f.periodo === 'todos' ? 'geral' : f.periodo;
      exportarExcel([
        { nome:'Chamados', linhas: linhasChamados },
        { nome:'Setores', linhas: rankSetores.map(([setor,qtd]) => ({ 'Setor': setor, 'Chamados': qtd })) },
        { nome:'Itens mais pedidos', linhas: rankItens.map(([item,qtd]) => ({ 'Item': item, 'Quantidade total': qtd })) },
        { nome:'Avaliação', linhas: linhasAvaliacao }
      ], `apis_flora_relatorio_${sufixoPeriodo}_${new Date().toISOString().slice(0,10)}.xlsx`);
    };
  }
}

/* ---------------- CONFIGURAÇÕES ---------------- */
function renderConfigTab(){
  const wrap = document.getElementById('tabContent');

  if(!state.configUnlocked){
    wrap.innerHTML = `
      <div class="panel" style="max-width:380px; margin:0 auto; text-align:center;">
        <h2 class="section-title">Configurações</h2>
        <p class="section-sub">Área restrita. Digite a senha de configurações para continuar.</p>
        <div class="field" style="text-align:left;">
          <label>Senha</label>
          <input type="password" id="fSenhaCfg" placeholder="••••••••">
        </div>
        <div id="cfgErr" class="error-msg" style="display:${state._cfgErr?'block':'none'};">Senha incorreta.</div>
        <button class="btn btn-primary" id="entrarCfgBtn" style="width:100%; margin-top:8px;">Entrar</button>
      </div>
    `;
    const inp = document.getElementById('fSenhaCfg');
    const tryCfgLogin = () => {
      if(inp.value === state.senhaConfig){
        state.configUnlocked = true;
        state._cfgErr = false;
        renderConfigTab();
      } else {
        state._cfgErr = true;
        document.getElementById('cfgErr').style.display = 'block';
      }
    };
    document.getElementById('entrarCfgBtn').onclick = tryCfgLogin;
    inp.onkeydown = e => { if(e.key === 'Enter') tryCfgLogin(); };
    inp.focus();
    return;
  }

  wrap.innerHTML = `
    <div class="panel">
      <div class="cfg-section">
        <h3>Banco de dados</h3>
        <p class="hint">Status da conexão com o banco de dados compartilhado.</p>
        ${firebaseDB ? `
          <div class="acesso-row" style="border:none;"><span style="color:var(--green); font-weight:700;">🟢 Conectado ao banco online (Firebase)</span><span style="color:var(--ink-soft); font-size:12.5px;">Todos os computadores veem os mesmos dados</span></div>
          ${ultimoErroFirebase ? `<div class="acesso-row" style="border:none;"><span style="color:var(--red); font-weight:700;">🔴 Último erro do banco</span><span style="color:var(--red); font-size:12.5px; max-width:320px; text-align:right;">${esc(ultimoErroFirebase)}</span></div>` : ''}
        ` : `
          <div class="acesso-row" style="border:none;"><span style="color:var(--amber); font-weight:700;">🟡 Rodando em modo local</span><span style="color:var(--ink-soft); font-size:12.5px;">Dados salvos só neste aparelho</span></div>
        `}
      </div>
      <div class="cfg-section">
        <h3>Senha da Logística</h3>
        <p class="hint">Essa é a senha usada para entrar na área de Estoque / Logística.</p>
        <div class="row2">
          <div class="field" style="margin:0;"><label>Nova senha</label><input type="text" id="novaSenha" placeholder="Digite a nova senha"></div>
        </div>
        <button class="btn btn-primary" id="salvarSenhaBtn" style="margin-top:14px;">Salvar nova senha</button>
      </div>
      <div class="cfg-section">
        <h3>Senha das Configurações</h3>
        <p class="hint">Essa é a senha extra usada só para entrar nesta aba de Configurações.</p>
        <div class="row2">
          <div class="field" style="margin:0;"><label>Nova senha</label><input type="text" id="novaSenhaCfg" placeholder="Digite a nova senha"></div>
        </div>
        <button class="btn btn-primary" id="salvarSenhaCfgBtn" style="margin-top:14px;">Salvar nova senha</button>
      </div>
      <div class="cfg-section">
        <h3>Senha para excluir chamados</h3>
        <p class="hint">Pedida sempre que alguém tentar excluir um chamado no painel.</p>
        <div class="row2">
          <div class="field" style="margin:0;"><label>Nova senha</label><input type="text" id="novaSenhaExcluir" placeholder="Digite a nova senha"></div>
        </div>
        <button class="btn btn-primary" id="salvarSenhaExcluirBtn" style="margin-top:14px;">Salvar nova senha</button>
      </div>
      <div id="produtosSection"></div>
      <div class="cfg-section">
        <h3>Últimos acessos</h3>

        <p class="hint">Registro dos últimos acessos feitos à área de Logística.</p>
        ${state.acessos.length===0 ? '<div class="empty-state">Nenhum acesso registrado ainda.</div>' :
          state.acessos.map(a => `<div class="acesso-row"><span>Acesso à área de Logística</span><span>${new Date(a.em).toLocaleString('pt-BR')}</span></div>`).join('')
        }
      </div>
    </div>
  `;
  document.getElementById('salvarSenhaBtn').onclick = async () => {
    const nova = document.getElementById('novaSenha').value.trim();
    if(nova.length < 4){ toast('A senha precisa ter pelo menos 4 caracteres.'); return; }
    await salvarNovaSenha(nova);
    toast('Senha da Logística atualizada.');
    document.getElementById('novaSenha').value = '';
  };
  document.getElementById('salvarSenhaCfgBtn').onclick = async () => {
    const nova = document.getElementById('novaSenhaCfg').value.trim();
    if(nova.length < 4){ toast('A senha precisa ter pelo menos 4 caracteres.'); return; }
    await salvarNovaSenhaConfig(nova);
    toast('Senha das Configurações atualizada.');
    document.getElementById('novaSenhaCfg').value = '';
  };
  document.getElementById('salvarSenhaExcluirBtn').onclick = async () => {
    const nova = document.getElementById('novaSenhaExcluir').value.trim();
    if(nova.length < 4){ toast('A senha precisa ter pelo menos 4 caracteres.'); return; }
    await salvarNovaSenhaExcluir(nova);
    toast('Senha de exclusão atualizada.');
    document.getElementById('novaSenhaExcluir').value = '';
  };
  renderProdutosTab('produtosSection');
}

/* ---------------- init ---------------- */
(async function init(){
  await firebaseAuthPronto; // espera o login anônimo (se houver Firebase) antes de tocar no banco
  await loadData();
  render();
  iniciarListenerChamados();
})();
</script>
</body>
