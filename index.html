<style>
  :root{
    --p-950:#051F20;
    --p-900:#0B2B26;
    --p-800:#163832;
    --p-700:#235347;
    --p-300:#8EB69B;
    --p-100:#DAF1DE;
    --green:#235347;
    --green-deep:#0B2B26;
    --green-soft:#DAF1DE;
    --stripe:#8EB69B;
    --yellow:#F6C500;
    --red:#C81E1E;
    --ink:#12211D;
    --ink-soft:#5C6E67;
    --paper:#F5FAF6;
    --panel:#FFFFFF;
    --line:#E0EAE3;
    --amber:#C97A00;
    --orange:#D9531E;
    --gray:#8B8578;
  }
  [data-theme="dark"]{
    --green:#4CAF8E;
    --green-deep:#8EB69B;
    --green-soft:#153029;
    --ink:#EAF3EE;
    --ink-soft:#9FB3AB;
    --paper:#0D1917;
    --panel:#152522;
    --line:#26433C;
    --p-100:#1B332C;
    --p-700:#4CAF8E;
    --amber:#E0A030;
    --red:#F17575;
  }
  [data-theme="dark"] body{background:var(--paper);}
  [data-theme="dark"] .comb-bg{opacity:.12;}
  [data-theme="dark"] .field input, [data-theme="dark"] .field select, [data-theme="dark"] .field textarea,
  [data-theme="dark"] .filters select, [data-theme="dark"] .filters input, [data-theme="dark"] table select{
    background:#0D1917; color:var(--ink); border-color:var(--line);
  }
  [data-theme="dark"] .chat-body{background:var(--paper);}
  [data-theme="dark"] .chat-msg.other .chat-bubble{background:var(--panel); color:var(--ink);}
  [data-theme="dark"] .code-chip{background:#1B332C; color:var(--ink);}
  [data-theme="dark"] img.logo-img{filter:none;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.font-display{font-family:'Plus Jakarta Sans',sans-serif;}
  /* remove seta nativa de inputs com datalist */
  input[list]::-webkit-calendar-picker-indicator{ display:none !important; -webkit-appearance:none !important; }
  input[list]::-webkit-list-button{ display:none !important; -webkit-appearance:none !important; }
  .comb-bg{
    position:fixed; inset:0; z-index:-1; opacity:.05;
    background-image:
      radial-gradient(circle at 15% 20%, var(--p-700) 0, transparent 38%),
      radial-gradient(circle at 85% 75%, var(--p-300) 0, transparent 38%);
  }

  header{
    display:flex; flex-direction:row; align-items:center; justify-content:flex-start; gap:14px;
    padding:14px 22px;
    background:linear-gradient(180deg, var(--green) 0%, var(--green-deep) 100%);
    border-bottom:4px solid var(--stripe);
    position:relative;
  }
  .logo-img{ border-radius:14px; }
  header .logo-img{height:46px; width:auto; display:block;}
  header .header-actions{
    position:absolute; right:20px; top:50%; transform:translateY(-50%);
    display:flex; align-items:center; gap:10px;
  }
  header .backbtn{
    background:rgba(255,255,255,.08); border:1.5px solid rgba(255,255,255,.25); color:#EAF2EC;
    padding:8px 14px; border-radius:9px; font-family:inherit; font-weight:600; font-size:13px;
    cursor:pointer; transition:.15s;
  }
  header .backbtn:hover{border-color:var(--yellow); color:var(--yellow); background:rgba(255,255,255,.14);}
  header .theme-toggle{
    background:rgba(255,255,255,.08); border:1.5px solid rgba(255,255,255,.25); color:#EAF2EC;
    width:36px; height:36px; border-radius:9px; font-size:16px; cursor:pointer; transition:.15s; flex-shrink:0;
  }
  header .theme-toggle:hover{border-color:var(--yellow); background:rgba(255,255,255,.14);}
  @media(max-width:560px){
    header{flex-wrap:wrap;}
    header .header-actions{position:static; transform:none; margin-left:auto;}
  }

  main{max-width:1080px; margin:0 auto; padding:44px 24px 80px;}

  /* ---------- LANDING ---------- */
  .landing-scene{position:relative;}
  .landing-hero, .role-grid{position:relative; z-index:1;}
  .landing-hero{text-align:center; margin-bottom:40px;}
  .landing-hero h1{
    font-weight:800; font-size:32px; margin:0; letter-spacing:-.5px; color:var(--ink);
  }
  .landing-decor{position:absolute; z-index:0; pointer-events:none;}
  .landing-decor-1{width:150px; height:150px; border-radius:50%; background:var(--p-100); top:-46px; left:-64px;}
  .landing-decor-2{width:64px; height:64px; border-radius:16px; background:var(--yellow); opacity:.85; top:6px; right:-24px; transform:rotate(18deg);}
  .landing-decor-3{width:32px; height:32px; border-radius:50%; border:5px solid var(--p-300); bottom:56px; left:6%;}
  .landing-decor-4{width:20px; height:20px; border-radius:6px; background:var(--red); opacity:.75; bottom:-6px; right:12%; transform:rotate(20deg);}
  .landing-decor-5{width:90px; height:90px; border-radius:50%; background:var(--p-100); opacity:.7; bottom:-30px; right:-40px;}
  @media(max-width:680px){ .landing-decor{display:none;} }
  .role-grid{display:flex; flex-direction:column; gap:16px; max-width:720px; margin:0 auto;}
  .role-card{
    background:var(--panel); border:1.5px solid var(--line); border-radius:18px;
    padding:26px 28px; text-align:left; cursor:pointer; transition:.2s;
    position:relative; overflow:hidden; box-shadow:0 1px 2px rgba(27,27,22,.03);
    display:flex; align-items:center; gap:26px; justify-content:space-between;
  }
  @media(max-width:640px){.role-card{flex-direction:column; align-items:flex-start; gap:14px;}}
  .role-card:hover{transform:translateY(-3px); box-shadow:0 16px 32px rgba(31,74,52,.12); border-color:var(--green);}
  .role-card .rc-main{flex:1; min-width:0;}
  .role-card .tag{
    display:inline-block; font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
    padding:5px 11px; border-radius:20px; margin-bottom:14px;
  }
  .role-card.req .tag{background:var(--green-soft); color:var(--green);}
  .role-card.stk .tag{background:#231F17; color:var(--yellow);}
  .role-card h2{font-weight:700; font-size:19px; margin:0 0 8px;}
  .role-card p{color:var(--ink-soft); font-size:13.5px; margin:0; line-height:1.55;}
  .role-card .go{font-weight:700; font-size:13.5px; color:var(--green); white-space:nowrap;}

  /* ---------- SHARED ---------- */
  .panel{background:var(--panel); border:1.5px solid var(--line); border-radius:20px; padding:28px; box-shadow:0 1px 2px rgba(27,27,22,.03); overflow:hidden;}
  h2.section-title{font-weight:700; font-size:20px; margin:0 0 4px;}
  .section-sub{color:var(--ink-soft); font-size:13.5px; margin:0 0 22px;}

  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-soft); margin-bottom:7px;}
  .field input, .field select, .field textarea{
    width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:12px;
    font-family:inherit; font-size:14.5px; background:#FCFBF8; color:var(--ink); transition:.15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--green); background:#fff; box-shadow:0 0 0 4px var(--green-soft);}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .row3{display:grid; grid-template-columns:1.4fr 1fr auto; gap:10px; align-items:end;}
  @media(max-width:640px){.row2,.row3{grid-template-columns:1fr;}}

  .item-row{display:grid; grid-template-columns:1fr 1.6fr .8fr auto; gap:10px; align-items:end; margin-bottom:10px;}
  @media(max-width:700px){.item-row{grid-template-columns:1fr;}}
  .item-row .rm{
    background:#FBE9E7; color:var(--red); border:none; border-radius:10px; width:40px; height:40px;
    font-size:16px; cursor:pointer; font-weight:700;
  }
  .add-item{
    background:none; border:1.5px dashed var(--line); color:var(--ink-soft); border-radius:12px;
    padding:11px; width:100%; font-family:inherit; font-weight:600; font-size:13.5px; cursor:pointer; margin-bottom:20px;
    transition:.15s;
  }
  .add-item:hover{border-color:var(--green); color:var(--green); background:var(--green-soft);}

  .btn{
    font-family:inherit; font-weight:700; font-size:14.5px; border:none; border-radius:12px;
    padding:14px 22px; cursor:pointer; transition:.15s;
  }
  .btn-primary{background:var(--green); color:#fff;}
  .btn-primary:hover{background:var(--green-deep);}
  .btn-primary:disabled{opacity:.5; cursor:not-allowed;}
  .btn-ghost{background:transparent; border:1.5px solid var(--line); color:var(--ink);}
  .btn-ghost:hover{border-color:var(--green); color:var(--green);}

  .toast{
    position:fixed; top:20px; left:50%; transform:translateX(-50%);
    background:var(--green-deep); color:#fff; padding:13px 22px; border-radius:12px;
    font-weight:600; font-size:14px; z-index:999; box-shadow:0 8px 24px rgba(0,0,0,.25);
    animation:fadein .2s ease-out;
  }
  @keyframes fadein{from{opacity:0; transform:translate(-50%,-8px);} to{opacity:1; transform:translate(-50%,0);}}

  /* login estoque */
  .login-box{max-width:380px; margin:50px auto 0; text-align:center;}
  .login-box .logo-img{height:46px; margin:0 auto 20px; display:block;}
  .login-box .field{text-align:left;}
  .error-msg{color:var(--red); font-size:13px; font-weight:600; margin-top:8px;}

  /* estoque dashboard */
  .kpis{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; margin-bottom:26px;}
  @media(max-width:700px){.kpis{grid-template-columns:1fr 1fr;}}
  .kpi{background:var(--panel); border:1.5px solid var(--line); border-radius:16px; padding:18px;}
  .kpi .num{font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:28px;}
  .kpi .lbl{font-size:12px; color:var(--ink-soft); font-weight:600; text-transform:uppercase; letter-spacing:.5px; margin-top:2px;}

  .tabs{display:flex; gap:6px; margin-bottom:20px; border-bottom:1.5px solid var(--line);}
  .tab-btn{
    background:none; border:none; padding:10px 16px; font-family:inherit; font-weight:700; font-size:14px;
    color:var(--ink-soft); cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-1.5px;
  }
  .tab-btn.active{color:var(--green); border-bottom-color:var(--green);}

  .filters{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px;}
  .filters select, .filters input{
    padding:9px 12px; border:1.5px solid var(--line); border-radius:10px; font-family:inherit; font-size:13.5px;
    min-width:0; box-sizing:border-box;
  }
  .filters input{flex:1 1 180px; min-width:120px;}
  .filters select{flex:1 1 130px;}
  @media(max-width:560px){
    .filters{flex-direction:column;}
    .filters select, .filters input{width:100%;}
  }
  #tableWrap{overflow-x:auto; -webkit-overflow-scrolling:touch;}

  table{width:100%; min-width:760px; border-collapse:collapse; font-size:13.5px;}
  th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-soft); padding:10px 12px; border-bottom:2px solid var(--line);}
  td{padding:12px; border-bottom:1px solid var(--line); vertical-align:top;}
  tr:hover td{background:rgba(35,83,71,.06);}
  .code-chip{font-family:monospace; font-weight:700; font-size:12.5px; background:#F2EEDF; padding:3px 7px; border-radius:6px; white-space:nowrap; display:inline-block;}
  .mini-open-btn{background:none; border:1.5px solid var(--line); color:var(--green); font-weight:700; font-size:11px; padding:3px 7px; border-radius:6px; cursor:pointer; white-space:nowrap;}
  .pin-btn{background:none; border:1.5px solid var(--line); border-radius:6px; width:24px; height:24px; font-size:12px; cursor:pointer; opacity:.4; filter:grayscale(1); flex-shrink:0;}
  .pin-btn:hover{opacity:.8;}
  .pin-btn.ativo{opacity:1; filter:none; border-color:var(--amber); background:#FFF3D6;}
  .char-counter{font-size:11.5px; color:var(--ink-soft);}
  .char-counter.perto{color:var(--amber); font-weight:700;}
  .mini-open-btn:hover{border-color:var(--green); background:var(--p-100);}
  .acoes-x{background:#FBE9E7; color:var(--red); border:none; border-radius:50%; width:22px; height:22px; font-size:12px; font-weight:800; cursor:pointer; line-height:1; vertical-align:middle;}
  .acoes-pop{margin-top:8px; padding:8px; border:1.5px solid var(--line); border-radius:10px; background:#fff; display:flex; flex-direction:column; gap:6px; align-items:flex-start;}
  .acoes-pop button{background:none; border:none; color:var(--red); font-weight:700; font-size:12px; cursor:pointer; padding:0;}
  .acoes-pop button[data-trocar]{color:var(--ink-soft);}
  .badge{display:inline-block; font-size:11.5px; font-weight:700; padding:4px 9px; border-radius:20px;}
  .badge-foto{border-radius:9px; line-height:1.35; text-align:center; padding:5px 8px;}
  .badge-novo{background:#DDEBFF; color:#1D5FBF;}
  .badge-analise{background:#FFF3C4; color:#8A6A00;}
  .badge-separando{background:#FFE3CC; color:#B25A00;}
  .badge-semestoque{background:#F3E2E2; color:#A31E1E;}
  .badge-entregue{background:#DDF3E2; color:var(--green);}
  .badge-retirado{background:#EDE4FB; color:#6B3FC4;}
  .badge-cancelado{background:#F3E2E2; color:var(--red);}
  .prio-baixa{color:var(--gray);}
  .prio-media{color:var(--amber);}
  .prio-alta{color:var(--orange);}
  .prio-urgente{color:var(--red); font-weight:800;}
  select.status-select{padding:7px 8px; border-radius:8px; border:1.5px solid var(--line); font-family:inherit; font-size:12.5px; font-weight:600;}
  .del-link{background:none; border:none; color:var(--red); font-weight:700; cursor:pointer; font-size:12px; margin-top:8px;}
  .items-mini{font-size:12.5px; color:var(--ink-soft);}
  .items-mini div{margin-bottom:2px;}
  .empty-state{text-align:center; padding:50px 20px; color:var(--ink-soft);}

  .prod-grid{display:grid; grid-template-columns:1fr; gap:8px; margin-top:18px;}
  .prod-row{
    display:grid; grid-template-columns:120px 1fr 90px auto; gap:10px; align-items:center;
    padding:10px 12px; border:1.5px solid var(--line); border-radius:12px; font-size:13.5px;
  }
  @media(max-width:640px){.prod-row{grid-template-columns:1fr; gap:4px;}}
  .prod-row .del{background:none; border:none; color:var(--red); font-weight:700; cursor:pointer; font-size:13px; justify-self:end;}

  .req-layout{display:flex; gap:32px; align-items:flex-start; max-width:1000px; margin:0 auto;}
  .mine-list{width:300px; flex:none; margin-top:8px;}
  .mine-list .section-title{text-align:left;}
  .mine-card{
    border:1.5px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px;
    display:flex; flex-direction:column; align-items:flex-start; gap:8px;
    background:#fff;
  }
  @media(max-width:900px){
    .req-layout{flex-direction:column;}
    .req-scene{order:-1;}
    .mine-list{width:100%;}
  }

  /* ---------- CENA DO SOLICITANTE (estilo cartão com acentos) ---------- */
  .req-scene{position:relative; flex:1; min-width:0; max-width:600px; margin:0; padding:6px 0 0;}
  .req-card{border-radius:28px; padding:34px 32px; position:relative; z-index:2; box-shadow:0 24px 50px -12px rgba(11,43,38,.16);}
  .req-card .section-title, .req-card .section-sub{text-align:center;}
  .req-card .section-title{font-size:22px;}
  .req-decor{position:absolute; z-index:1; pointer-events:none;}
  .req-decor-1{width:80px; height:80px; border-radius:50%; background:var(--p-100); top:-26px; left:-34px;}
  .req-decor-2{width:44px; height:44px; border-radius:12px; background:var(--yellow); opacity:.85; bottom:-16px; right:-18px; transform:rotate(18deg);}
  .req-decor-3{width:22px; height:22px; border-radius:50%; border:4px solid var(--p-300); top:38%; right:-30px;}
  .req-decor-4{width:14px; height:14px; border-radius:4px; background:var(--red); opacity:.75; top:14px; right:-8px; transform:rotate(20deg);}
  @media(max-width:680px){ .req-decor{display:none;} }

  /* ---------- HUB DO ESTOQUE (sidebar) ---------- */
  .dash-scene{position:relative;}
  .dash-shell{display:flex; gap:20px; align-items:flex-start; position:relative; z-index:1;}
  .dash-decor{position:absolute; z-index:0; pointer-events:none;}
  .dash-decor-1{width:170px; height:170px; border-radius:50%; background:var(--p-100); top:-50px; right:-60px;}
  .dash-decor-2{width:56px; height:56px; border-radius:14px; background:var(--yellow); opacity:.8; bottom:-18px; left:26%; transform:rotate(14deg);}
  .dash-decor-3{width:28px; height:28px; border-radius:50%; border:5px solid var(--p-300); top:46%; left:-38px;}
  .dash-decor-4{width:16px; height:16px; border-radius:5px; background:var(--red); opacity:.7; top:8%; left:34%; transform:rotate(20deg);}
  @media(max-width:900px){ .dash-decor{display:none;} }
  .dash-sidebar{
    width:210px; flex:none; background:linear-gradient(165deg, var(--p-800) 0%, var(--p-950) 100%);
    border-radius:20px; padding:18px 14px; position:sticky; top:20px;
  }
  .dash-sidebar-title{color:#A9CDB6; font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; padding:6px 10px 14px;}
  .dash-nav-btn{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:none; border:none; color:#D9E9DD; font-family:inherit; font-weight:600; font-size:14px;
    padding:11px 12px; border-radius:12px; cursor:pointer; margin-bottom:4px; transition:.15s;
  }
  .dash-nav-btn:hover{background:rgba(255,255,255,.06);}
  .dash-nav-btn.active{background:var(--p-100); color:var(--p-900);}
  .dash-main{flex:1; min-width:0;}
  @media(max-width:820px){
    .dash-shell{flex-direction:column;}
    .dash-sidebar{width:100%; position:static; display:flex; gap:6px; padding:10px;}
    .dash-sidebar-title{display:none;}
    .dash-nav-btn{width:auto;}
  }

  .kpi{background:var(--panel); border:1.5px solid var(--line); border-radius:16px; padding:18px; position:relative;}
  .kpi-icon{
    width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-size:16px; margin-bottom:12px;
  }
  .import-row{display:flex; align-items:center; gap:12px; margin:2px 0 4px; flex-wrap:wrap;}
  .import-row .hint{font-size:12px; color:var(--ink-soft);}

  /* ---------- ABA DADOS ---------- */
  .stat-cards{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; margin-bottom:22px;}
  @media(max-width:700px){.stat-cards{grid-template-columns:1fr;}}
  .stat-card{background:var(--panel); border:1.5px solid var(--line); border-radius:16px; padding:18px;}
  .stat-card .num{font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:24px; color:var(--green);}
  .stat-card .lbl{font-size:12px; color:var(--ink-soft); font-weight:600; text-transform:uppercase; letter-spacing:.5px; margin-top:2px;}
  .rank-row{display:grid; grid-template-columns:120px 1fr 46px; gap:12px; align-items:center; margin-bottom:11px; font-size:13.5px;}
  .rank-row .rname{font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rank-bar-wrap{background:var(--green-soft); border-radius:8px; height:10px; overflow:hidden;}
  .rank-bar{background:var(--green); height:100%; border-radius:8px;}
  .rank-row .rval{text-align:right; font-weight:700; color:var(--ink-soft);}

  /* ---------- ABA CONFIGURAÇÕES ---------- */
  .cfg-section{margin-bottom:28px;}
  .cfg-section:last-child{margin-bottom:0;}
  .cfg-section h3{font-size:15px; font-weight:700; margin:0 0 4px;}
  .cfg-section .hint{font-size:13px; color:var(--ink-soft); margin:0 0 14px;}
  .acesso-row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .acesso-row:last-child{border-bottom:none;}
  #printArea{position:fixed; left:-9999px; top:0; width:800px;}
  @media print{
    body *{ visibility:hidden; }
    #printArea, #printArea *{ visibility:visible; }
    #printArea{ position:absolute; left:0; top:0; width:100%; }
  }

  /* ---------- CHAT DO CHAMADO ---------- */
  .chat-btn{
    position:relative; background:var(--green-soft); border:1.5px solid transparent; color:var(--green);
    width:36px; height:36px; border-radius:11px; font-size:16px; cursor:pointer; transition:.15s;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .chat-btn:hover{background:var(--p-100); border-color:var(--green);}
  .chat-dot{
    position:absolute; top:-3px; right:-3px; width:11px; height:11px; border-radius:50%;
    background:var(--red); border:2px solid var(--paper); box-shadow:0 0 0 1px var(--red);
  }
  .chat-backdrop{
    position:fixed; inset:0; background:rgba(11,43,38,.45); z-index:1000;
    display:flex; align-items:center; justify-content:center; padding:16px;
    animation:fadein .15s ease-out;
  }
  .chat-panel{
    width:440px; max-width:100%; height:min(640px,88vh); background:var(--panel); border-radius:22px;
    box-shadow:0 24px 60px rgba(0,0,0,.35); display:flex; flex-direction:column; overflow:hidden;
  }
  .chat-header{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:16px 18px; background:linear-gradient(180deg, var(--green) 0%, var(--green-deep) 100%); color:#fff; flex:none;
  }
  .chat-title{font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:15px; display:flex; align-items:center; gap:8px;}
  .chat-title .code-chip{background:rgba(255,255,255,.18); color:#fff;}
  .chat-sub{font-size:12px; color:#C8DFD0; margin-top:3px;}
  .chat-close{
    background:rgba(255,255,255,.12); border:none; color:#fff; width:30px; height:30px; border-radius:9px;
    font-size:14px; font-weight:700; cursor:pointer; flex:none;
  }
  .chat-close:hover{background:rgba(255,255,255,.22);}
  .chat-body{flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; background:var(--paper);}
  .chat-empty{margin:auto; text-align:center; color:var(--ink-soft); font-size:13.5px; max-width:220px;}
  .typing-bubble{display:flex; align-items:center; gap:4px; padding:13px 16px !important;}
  .typing-dot{width:7px; height:7px; border-radius:50%; background:var(--ink-soft); opacity:.5; animation:typingBounce 1.2s infinite ease-in-out;}
  .typing-dot:nth-child(2){animation-delay:.2s;}
  .typing-dot:nth-child(3){animation-delay:.4s;}
  @keyframes typingBounce{
    0%, 60%, 100%{transform:translateY(0); opacity:.5;}
    30%{transform:translateY(-5px); opacity:1;}
  }
  .chat-msg{display:flex; max-width:100%;}
  .chat-msg.mine{justify-content:flex-end;}
  .chat-msg.other{justify-content:flex-start;}
  .chat-bubble{max-width:78%; padding:9px 13px; border-radius:16px; box-shadow:0 1px 2px rgba(27,27,22,.06);}
  .chat-msg.mine .chat-bubble{background:var(--green); color:#fff; border-bottom-right-radius:4px;}
  .chat-msg.other .chat-bubble{background:#fff; color:var(--ink); border:1.5px solid var(--line); border-bottom-left-radius:4px;}
  .chat-author{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; margin-bottom:3px; opacity:.75;}
  .chat-text{font-size:14px; line-height:1.42; white-space:pre-wrap; word-break:break-word;}
  .chat-time{font-size:10.5px; margin-top:5px; opacity:.65; text-align:right;}
  .chat-composer{display:flex; align-items:flex-end; gap:10px; padding:12px 14px; border-top:1.5px solid var(--line); background:#fff; flex:none;}
  .chat-composer textarea{
    flex:1; resize:none; max-height:110px; padding:10px 13px; border:1.5px solid var(--line); border-radius:14px;
    font-family:inherit; font-size:14px; background:#FCFBF8; color:var(--ink);
  }
  .chat-composer textarea:focus{outline:none; border-color:var(--green); background:#fff; box-shadow:0 0 0 4px var(--green-soft);}
  .chat-composer .btn{padding:12px 18px;}
  @media(max-width:520px){ .chat-panel{height:92vh; border-radius:16px;} }

  /* ---------- CENTRAL DE AJUDA ---------- */
  .ajuda-panel{width:560px; max-width:100%; height:min(680px,88vh); display:flex; flex-direction:column;}
  .ajuda-body{flex:1; overflow-y:auto; padding:18px 22px;}
  .ajuda-grupo{margin-bottom:22px;}
  .ajuda-grupo-titulo{font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--green); margin-bottom:10px;}
  .ajuda-item{border:1.5px solid var(--line); border-radius:12px; margin-bottom:8px; overflow:hidden; background:#fff;}
  .ajuda-pergunta{width:100%; text-align:left; background:none; border:none; padding:13px 16px; font-family:inherit; font-weight:700; font-size:13.5px; color:var(--ink); cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .ajuda-pergunta:hover{background:var(--paper);}
  .ajuda-pergunta .seta{transition:.2s; flex-shrink:0; color:var(--ink-soft);}
  .ajuda-item.aberto .ajuda-pergunta .seta{transform:rotate(180deg);}
  .ajuda-resposta{max-height:0; overflow:hidden; transition:.2s ease; font-size:13.5px; line-height:1.55; color:var(--ink-soft);}
  .ajuda-item.aberto .ajuda-resposta{max-height:400px;}
  .ajuda-resposta-inner{padding:0 16px 14px;}
  [data-theme="dark"] .ajuda-item{background:var(--panel);}

  /* ---------- TOUR GUIADO ---------- */
  .tour-destaque{ outline:3px solid var(--yellow) !important; outline-offset:2px; border-radius:8px; position:relative; z-index:50; animation:tourPulse 1.4s infinite; }
  @keyframes tourPulse{ 0%,100%{outline-color:var(--yellow);} 50%{outline-color:var(--green);} }
  .tour-card{ position:absolute; z-index:1400; width:280px; max-width:calc(100vw - 24px); background:var(--panel); border:1.5px solid var(--green); border-radius:14px; padding:14px 16px; box-shadow:0 14px 34px rgba(0,0,0,.22); }
  .tour-progresso{ font-size:11px; font-weight:700; color:var(--green); text-transform:uppercase; letter-spacing:.5px; margin-bottom:4px; }
  .tour-titulo{ font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:14.5px; margin-bottom:4px; color:var(--ink); }
  .tour-texto{ font-size:13px; color:var(--ink-soft); line-height:1.45; margin-bottom:12px; }
  .tour-botoes{ display:flex; justify-content:space-between; gap:8px; }
  .tour-botoes .btn{ padding:7px 12px; font-size:12.5px; }
  @media(max-width:480px){ .tour-card{ position:fixed !important; left:12px !important; right:12px; width:auto; max-width:none; bottom:16px; top:auto !important; } }

  /* ---------- BANNER DE CONEXÃO ---------- */
  .conn-banner{
    position:sticky; top:0; z-index:500; background:#FDECEC; border-bottom:2px solid #E9A8A8;
    color:#8A1F1F; padding:10px 20px; font-size:13px; font-weight:700;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center; text-align:center;
  }
  .conn-banner .conn-detail{font-weight:500; opacity:.85; font-size:12px;}
  .manut-banner{
    position:sticky; top:0; z-index:490; background:#FFF6D9; border-bottom:2px solid #F0DA9C;
    color:#7A5B00; padding:10px 20px; font-size:13px; font-weight:700;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center; text-align:center;
  }
  .manut-banner .manut-detail{font-weight:500; opacity:.85; font-size:12px;}
  [data-theme="dark"] .manut-banner{background:#3A2E00; border-bottom-color:#5C4A00; color:#F6D97A;}
  .versao-banner{
    position:sticky; top:0; z-index:495; background:#E6F0FF; border-bottom:2px solid #A9C7F5;
    color:#1D4E9E; padding:10px 20px; font-size:13px; font-weight:700;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:center; text-align:center;
  }
  .versao-banner button{
    background:#1D4E9E; color:#fff; border:none; padding:7px 16px; border-radius:8px;
    font-family:inherit; font-weight:700; font-size:12.5px; cursor:pointer;
  }
  [data-theme="dark"] .versao-banner{background:#0F2647; border-bottom-color:#1D4E9E; color:#AFCBFA;}
  [data-theme="dark"] .conn-banner{background:#3A1414; border-bottom-color:#5C1F1F; color:#F5A0A0;}

  /* ---------- NOTIFICAÇÕES POPUP ---------- */
  #notifStack{
    position:fixed; bottom:18px; right:18px; z-index:1300;
    display:flex; flex-direction:column; gap:10px; align-items:flex-end;
    max-width:min(340px, calc(100vw - 32px));
    pointer-events:none;
  }
  .notif-card{
    pointer-events:auto; width:100%; background:#fff; border:1.5px solid var(--line); border-left:5px solid var(--green);
    border-radius:12px; padding:12px 15px; box-shadow:0 12px 30px rgba(11,43,38,.22);
    cursor:pointer; animation:notifIn .25s ease-out; transition:.15s;
  }
  .notif-card:hover{border-left-color:var(--green-deep); transform:translateY(-2px); box-shadow:0 16px 34px rgba(11,43,38,.28);}
  .notif-title{font-weight:800; font-size:13.5px; color:var(--ink); margin-bottom:3px; display:flex; align-items:center; gap:6px;}
  .notif-sub{font-size:12.5px; color:var(--ink-soft); line-height:1.35;}
  @keyframes notifIn{ from{opacity:0; transform:translateX(36px);} to{opacity:1; transform:translateX(0);} }
  @keyframes notifOut{ from{opacity:1; max-height:120px;} to{opacity:0; transform:translateX(36px); max-height:0; margin:0; padding-top:0; padding-bottom:0;} }
  @media(max-width:480px){ #notifStack{ left:12px; right:12px; max-width:none; align-items:stretch; } }

  /* ---------- AÇÕES EM LOTE ---------- */
  .chk-linha, #selecionarTodos{ width:17px; height:17px; cursor:pointer; accent-color:var(--green); }
  .bulk-bar{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    background:var(--green-soft); border:1.5px solid var(--green); border-radius:14px;
    padding:11px 16px; margin-bottom:16px; animation:fadein .15s ease-out;
  }
  .bulk-bar .bulk-count{font-weight:800; color:var(--green-deep); font-size:13.5px; white-space:nowrap;}
  .bulk-bar select{padding:8px 10px; border:1.5px solid var(--line); border-radius:9px; font-family:inherit; font-size:13.5px; background:#fff;}
  .bulk-bar .btn{padding:9px 16px; font-size:13px;}
  .bulk-bar .bulk-hint{color:var(--ink-soft); font-size:11.5px; margin-left:auto;}
  @media(max-width:700px){ .bulk-bar{padding:11px;} .bulk-bar .bulk-hint{margin-left:0; width:100%;} }
</style>
</head>

function aplicarTema(tema){
  document.documentElement.setAttribute('data-theme', tema);
  const btn = document.getElementById('themeToggleBtn');
  if(btn) btn.textContent = tema === 'dark' ? '☀️' : '🌙';
  try{ localStorage.setItem('apisflora_tema', tema); }catch(e){}
}
function iniciarTema(){
  let salvo = null;
  try{ salvo = localStorage.getItem('apisflora_tema'); }catch(e){}
  aplicarTema(salvo === 'dark' ? 'dark' : 'light');
  const btn = document.getElementById('themeToggleBtn');
  if(btn){
    btn.onclick = () => {
      const atual = document.documentElement.getAttribute('data-theme');
      aplicarTema(atual === 'dark' ? 'light' : 'dark');
    };
  }
  const ajudaBtn = document.getElementById('ajudaBtn');
  if(ajudaBtn) ajudaBtn.onclick = abrirAjuda;
}

let tourPassoAtual = 0;
function iniciarTourSePrimeiraVez(){
  let visto = null;
  try{ visto = localStorage.getItem('apisflora_tour_visto'); }catch(e){}
  if(visto) return;
  tourPassoAtual = 0;
  setTimeout(mostrarPassoTour, 400);
}
function limparDestaqueTour(){
  document.querySelectorAll('.tour-destaque').forEach(el => el.classList.remove('tour-destaque'));
}
function mostrarPassoTour(){
  limparDestaqueTour();
  const passo = TOUR_PASSOS[tourPassoAtual];
  if(!passo){ finalizarTour(); return; }
  const alvo = document.querySelector(passo.seletor);
  if(!alvo){ tourPassoAtual++; mostrarPassoTour(); return; }
  alvo.classList.add('tour-destaque');
  if(alvo.scrollIntoView) alvo.scrollIntoView({ behavior:'smooth', block:'center' });
  let wrap = document.getElementById('tourCardWrap');
  if(!wrap){ wrap = document.createElement('div'); wrap.id = 'tourCardWrap'; document.body.appendChild(wrap); }
  const rect = alvo.getBoundingClientRect();
  const top = rect.bottom + window.scrollY + 10;
  const left = Math.max(12, Math.min(rect.left, window.innerWidth - 296));
  wrap.innerHTML = `
    <div class="tour-card" style="top:${top}px; left:${left}px;">
      <div class="tour-progresso">Passo ${tourPassoAtual+1} de ${TOUR_PASSOS.length}</div>
      <div class="tour-titulo">${esc(passo.titulo)}</div>
      <div class="tour-texto">${esc(passo.texto)}</div>
      <div class="tour-botoes">
        <button class="btn btn-ghost" id="tourPularBtn">Pular tour</button>
        <button class="btn btn-primary" id="tourProximoBtn">${tourPassoAtual === TOUR_PASSOS.length-1 ? 'Concluir' : 'Próximo →'}</button>
      </div>
    </div>
  `;
  document.getElementById('tourPularBtn').onclick = finalizarTour;
  document.getElementById('tourProximoBtn').onclick = () => { tourPassoAtual++; mostrarPassoTour(); };
}
function finalizarTour(){
  limparDestaqueTour();
  const wrap = document.getElementById('tourCardWrap');
  if(wrap) wrap.remove();
  try{ localStorage.setItem('apisflora_tour_visto', '1'); }catch(e){}
}

/* ---------------- avaliação da entrega pelo solicitante ---------------- */
function abrirAvaliacao(chamadoId){
  const overlay = document.getElementById('ajudaOverlay');
  if(!overlay) return;
  let notaEscolhida = 0;
  const desenhaEstrelas = () => Array.from({length:5}, (_,i) => `<button class="estrela-btn" data-estrela="${i+1}" style="background:none; border:none; font-size:32px; cursor:pointer; color:${i<notaEscolhida?'#F6C500':'#D8D8D0'};">★</button>`).join('');
  overlay.innerHTML = `
    <div class="chat-backdrop" id="avaliacaoBackdrop">
      <div class="chat-panel" style="height:auto; max-height:90vh;">
        <div class="chat-header">
          <div class="chat-title">⭐ Avaliar entrega <span class="code-chip">${esc(chamadoId)}</span></div>
          <button class="chat-close" id="avaliacaoCloseBtn" title="Fechar">✕</button>
        </div>
        <div style="padding:22px;">
          <p class="section-sub" style="margin-top:0;">Como foi a entrega desse chamado?</p>
          <div id="estrelasWrap" style="display:flex; gap:4px; margin-bottom:16px;">${desenhaEstrelas()}</div>
          <div class="field">
            <label>Comentário (opcional)</label>
            <textarea id="avaliacaoComentario" rows="3" maxlength="300" placeholder="Algo que queira contar sobre essa entrega…"></textarea>
          </div>
          <button class="btn btn-primary" id="enviarAvaliacaoBtn" style="width:100%;" disabled>Enviar avaliação</button>
        </div>
      </div>
    </div>
  `;
  const redesenhar = () => { document.getElementById('estrelasWrap').innerHTML = desenhaEstrelas(); ligarEstrelas(); };
  const ligarEstrelas = () => {
    document.querySelectorAll('.estrela-btn').forEach(btn => {
      btn.onclick = () => {
        notaEscolhida = Number(btn.dataset.estrela);
        document.getElementById('enviarAvaliacaoBtn').disabled = false;
        redesenhar();
      };
    });
  };
  ligarEstrelas();
  document.getElementById('avaliacaoCloseBtn').onclick = fecharAjuda;
  document.getElementById('avaliacaoBackdrop').onclick = e => { if(e.target.id === 'avaliacaoBackdrop') fecharAjuda(); };
  document.getElementById('enviarAvaliacaoBtn').onclick = async () => {
    if(notaEscolhida < 1) return;
    const c = state.chamados.find(x => x.id === chamadoId);
    if(!c){ toast('Chamado não encontrado.'); return; }
    const comentario = document.getElementById('avaliacaoComentario').value.trim().slice(0,300);
    const em = new Date().toISOString();
    c.avaliacao = { nota: notaEscolhida, comentario, em };
    c.historico = c.historico || [];
    c.historico.push({ tipo: 'avaliacao', nota: notaEscolhida, comentario, em });
    await saveChamados();
    toast('Obrigado pela avaliação!');
    fecharAjuda();
    renderMineList();
  };
}

      banco de verdade, compartilhado entre qualquer computador.

   3) localStorage do navegador — só neste aparelho, como último recurso. */
const LS_PREFIX = 'apisflora_chamados__';
const temStorageNativo = () => (typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function');

function chaveFirebase(key, shared){

}

async function checarVersaoNova(){
  try{
    const urlSemQuery = location.pathname;
    const resp = await fetch(`${urlSemQuery}?_cachebust=${Date.now()}`, { cache: 'no-store' });
    if(!resp.ok) return;
    const texto = await resp.text();
    const m = texto.match(/<meta\s+name="app-build"\s+content="([^"]+)"/i);
    const buildRemoto = m ? m[1] : null;
    const buildAtualEl = document.querySelector('meta[name="app-build"]');
    const buildAtual = buildAtualEl ? buildAtualEl.getAttribute('content') : null;
    const banner = document.getElementById('versaoBanner');
    if(!banner) return;
    if(buildRemoto && buildAtual && buildRemoto !== buildAtual){
      const irParaVersaoNova = () => { location.href = urlSemQuery + '?_=' + Date.now(); };
      if(temEntradaNaoSalva()){
        // tem algo digitado: não atualiza sozinho pra não derrubar o que a pessoa estava fazendo
        banner.innerHTML = `<div class="versao-banner">🔄 Tem uma versão mais nova publicada. Termine o que estiver fazendo e clique aqui. <button id="btnAtualizarVersao">Atualizar agora</button></div>`;
        document.getElementById('btnAtualizarVersao').onclick = irParaVersaoNova;
      } else {
        // nada em risco de se perder: atualiza sozinho depois de avisar por alguns segundos
        let restante = 5;
        const atualizaTexto = () => {
          banner.innerHTML = `<div class="versao-banner">🔄 Atualizando para a versão mais nova em ${restante}s… <button id="btnAtualizarVersao">Atualizar agora</button></div>`;
          const btn = document.getElementById('btnAtualizarVersao');
          if(btn) btn.onclick = irParaVersaoNova;
        };
        atualizaTexto();
        const contagem = setInterval(() => {
          restante--;
          if(restante <= 0 || temEntradaNaoSalva()){
            clearInterval(contagem);
            if(restante <= 0 && !temEntradaNaoSalva()) irParaVersaoNova();
            return;
          }
          atualizaTexto();
        }, 1000);
      }
    }
  }catch(e){ /* sem internet ou bloqueado: ignora, não é crítico */ }
}

/* ---------------- XLSX carregado sob demanda ----------------
   Essa biblioteca é pesada e só é usada por quem exporta ou importa planilha
   (normalmente só a Logística, raramente). Carregar ela sempre, pra todo
   mundo, deixava a abertura do sistema mais lenta à toa. */
let xlsxCarregando = null;
function carregarXLSX(){
  if(typeof XLSX !== 'undefined') return Promise.resolve();
  if(xlsxCarregando) return xlsxCarregando;
  xlsxCarregando = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    script.onload = () => resolve();
    script.onerror = () => { xlsxCarregando = null; reject(new Error('Não consegui carregar a biblioteca de planilhas. Confira sua conexão.')); };
    document.head.appendChild(script);
  });
  return xlsxCarregando;
}
async function comRetry(fn, tentativas, esperaBaseMs){
  tentativas = tentativas || 3;
  esperaBaseMs = esperaBaseMs || 1200;
  let ultimoErro;
  for(let i = 0; i < tentativas; i++){
    try{ return await fn(); }
    catch(e){
      ultimoErro = e;
      if(i < tentativas - 1) await new Promise(r => setTimeout(r, esperaBaseMs * (i + 1)));
    }
  }
  throw ultimoErro;
}

const db = {
  async get(key, shared){
    if(firebaseDB){
      try{
        const snap = await comRetry(() => firebaseDB.ref(chaveFirebase(key, shared)).once('value'), 2, 800);
        ultimoErroFirebase = null;
        atualizarBannerConexao();
        const val = snap.val();
        return val === null || val === undefined ? null : { key, value: val, shared };
      }catch(e){ ultimoErroFirebase = (e && e.message) || String(e); console.warn('Firebase get falhou, usando modo local:', e); atualizarBannerConexao(); }
    }
    if(temStorageNativo()){
      try{ return await window.storage.get(key, shared); }catch(e){ /* cai pro fallback */ }
    }
    try{
      const raw = localStorage.getItem(LS_PREFIX + key);
      return raw === null ? null : { key, value: raw, shared };
    }catch(e){ return null; }
  },
  async set(key, value, shared){
    if(firebaseDB){
      try{
        await comRetry(() => firebaseDB.ref(chaveFirebase(key, shared)).set(value), 2, 800);
        ultimoErroFirebase = null;
        atualizarBannerConexao();
        return { key, value, shared };
      }catch(e){ ultimoErroFirebase = (e && e.message) || String(e); console.warn('Firebase set falhou, usando modo local:', e); atualizarBannerConexao(); }
    }
    if(temStorageNativo()){
      try{ return await window.storage.set(key, value, shared); }catch(e){ /* cai pro fallback */ }
    }
    try{
      localStorage.setItem(LS_PREFIX + key, value);
      return { key, value, shared };
    }catch(e){ return null; }
  }
};

/* ---------------- storage ---------------- */
function processarChamadosRaw(raw){
  if(raw === null || raw === undefined) return false;
  try{
    const parsed = typeof raw === 'string' ? JSON.parse(raw) : raw;
    if(Array.isArray(parsed)){ // formato antigo, migra
      state.chamados = parsed;
      state.chamadoSeq = parsed.length;
    } else {
      state.chamados = parsed.lista || [];
      state.chamadoSeq = parsed.seq || state.chamados.length;
    }
    // migração de campos novos, compatível com chamados antigos já salvos
    state.chamados.forEach(c => {
      if(!Array.isArray(c.fotos)){ c.fotos = c.fotoEntrega ? [c.fotoEntrega] : []; }
      if(c.fixado === undefined) c.fixado = false;
      if(c.notaInterna === undefined) c.notaInterna = '';
      if(c.avaliacao === undefined) c.avaliacao = null;
      if(!Array.isArray(c.historico)) c.historico = [];
    });
    return true;
  }catch(e){ return false; }
}
async function sha256Hex(texto){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(texto));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
function pareceHashSha256(s){
  return typeof s === 'string' && /^[a-f0-9]{64}$/i.test(s);
}
/* se a senha ainda estiver em texto puro (de antes dessa atualização), converte pro hash
   silenciosamente, sem trocar a senha nem derrubar quem já usa o sistema */
async function garantirSenhaHasheada(valorAtual, chaveFirebaseSenha){
  if(!valorAtual) return valorAtual;
  if(pareceHashSha256(valorAtual)) return valorAtual;
  const hash = await sha256Hex(valorAtual);
  await db.set(chaveFirebaseSenha, JSON.stringify(hash), true);
  return hash;
}
async function loadData(){
  // lê tudo em paralelo (antes eram 8 idas-e-voltas sequenciais ao banco, uma esperando a outra)
  const chavesIniciais = [
    ['chamados', true], ['meus-ids', false], ['produtos', true],
    ['senha-estoque', true], ['senha-config', true], ['senha-excluir', true],
    ['acessos-estoque', true], ['manutencao', true]
  ];
  const [c, m, p, s, sc, se, a, man] = await Promise.all(
    chavesIniciais.map(([chave, shared]) => db.get(chave, shared).catch(() => null))
  );

  if(c){
    if(!processarChamadosRaw(c.value)){ state.chamados = []; state.chamadoSeq = 0; }
  } else {
    state.chamados = [];
    state.chamadoSeq = 0;
  }
  try{ state.meusIds = m ? JSON.parse(m.value) : []; }catch(e){ state.meusIds = []; }
  try{ state.produtos = p ? JSON.parse(p.value) : null; }catch(e){ state.produtos = null; }
  try{ state.senhaEstoque = s ? JSON.parse(s.value) : null; }catch(e){ state.senhaEstoque = null; }
  try{ state.senhaConfig = sc ? JSON.parse(sc.value) : null; }catch(e){ state.senhaConfig = null; }
  try{ state.senhaExcluir = se ? JSON.parse(se.value) : null; }catch(e){ state.senhaExcluir = null; }
  try{ state.acessos = a ? JSON.parse(a.value) : []; }catch(e){ state.acessos = []; }
  try{ state.manutencao = man ? JSON.parse(man.value) : null; }catch(e){ state.manutencao = null; }
  if(!state.manutencao){ state.manutencao = { ativo:false, inicio:'', fim:'', mensagem:'' }; }

  // valores padrão / migração de hash — só quando necessário, também em paralelo
  const pendencias = [];
  if(!state.produtos){
    state.produtos = { ...PRODUTOS_PADRAO_APIS_FLORA };
    pendencias.push(saveProdutos());
  }
  if(!state.senhaEstoque){
    state.senhaEstoque = await sha256Hex(SENHA_PADRAO_LOGISTICA);
    pendencias.push(db.set('senha-estoque', JSON.stringify(state.senhaEstoque), true));
  } else {
    pendencias.push(garantirSenhaHasheada(state.senhaEstoque, 'senha-estoque').then(v => { state.senhaEstoque = v; }));
  }
  if(!state.senhaConfig){
    state.senhaConfig = await sha256Hex(SENHA_PADRAO_CONFIG);
    pendencias.push(db.set('senha-config', JSON.stringify(state.senhaConfig), true));
  } else {
    pendencias.push(garantirSenhaHasheada(state.senhaConfig, 'senha-config').then(v => { state.senhaConfig = v; }));
  }
  if(!state.senhaExcluir){
    state.senhaExcluir = await sha256Hex(SENHA_PADRAO_EXCLUIR);
    pendencias.push(db.set('senha-excluir', JSON.stringify(state.senhaExcluir), true));
  } else {
    pendencias.push(garantirSenhaHasheada(state.senhaExcluir, 'senha-excluir').then(v => { state.senhaExcluir = v; }));
  }
  await Promise.all(pendencias);
  state.loading = false;
}

/* compara o que chegou agora com o snapshot anterior e dispara os avisos certos pra cada lado */
function detectarEExibirNotificacoes(){
  const antigoMap = snapshotChamados;
  const novoMap = {};
  state.chamados.forEach(c => {
    novoMap[c.id] = { status: c.status, mensagensCount: (c.mensagens||[]).length };
    const antigo = antigoMap[c.id];
    const chatAbertoAqui = state.chatAberto && state.chatAberto.chamadoId === c.id;

    if(!antigo){
      // chamado novo — avisa a Logística, se estiver na área dela
      if(state.screen === 'estoque'){
        mostrarNotificacaoPopup({
          titulo: `🆕 Chamado ${esc(c.id)} aberto agora`,
          subtitulo: `${esc(c.nome)} · ${esc(c.setor)}`,
          chamadoId: c.id, role: 'logistica'
        });
      }
      return;
    }

    // status mudou — avisa o solicitante, só se o chamado for dele
    if(antigo.status !== c.status && state.screen === 'solicitante' && state.meusIds.includes(c.id)){
      mostrarNotificacaoPopup({
        titulo: `🔄 Chamado ${esc(c.id)} atualizado`,
        subtitulo: `Novo status: ${esc(c.status)}`,
        chamadoId: c.id, role: 'solicitante'
      });
    }

    // mensagens novas no chat
    const msgs = c.mensagens || [];
    if(msgs.length > antigo.mensagensCount && !chatAbertoAqui){
      msgs.slice(antigo.mensagensCount).forEach(m => {
        if(m.autor === 'solicitante' && state.screen === 'estoque'){
          mostrarNotificacaoPopup({
            titulo: `💬 Mensagem no chamado ${esc(c.id)}`,
            subtitulo: `${esc(c.setor)} · ${esc(c.nome)} entrou em contato`,
            chamadoId: c.id, role: 'logistica'
          });
        } else if(m.autor === 'logistica' && state.screen === 'solicitante' && state.meusIds.includes(c.id)){
          mostrarNotificacaoPopup({
            titulo: `💬 Resposta no chamado ${esc(c.id)}`,
            subtitulo: `A logística respondeu seu chamado`,
            chamadoId: c.id, role: 'solicitante'
          });
        }
      });
    }
  });
  snapshotChamados = novoMap;
}

/* ---------- bloqueio progressivo após tentativas erradas ---------- */
function tentativasFalhasRecentes(area){
  let falhas = 0, ultimaFalhaEm = null;
  for(const a of state.acessos){
    if(a.area !== area) continue;
    if(a.sucesso) break; // achou um sucesso: para de contar, só interessam as falhas desde o último acerto
    falhas++;
    if(!ultimaFalhaEm) ultimaFalhaEm = a.em;
  }
  return { falhas, ultimaFalhaEm };
}
function tempoEsperaNecessario(falhas){
  if(falhas >= 6) return 60000;
  if(falhas >= 3) return 10000;
  return 0;
}
function bloqueioAtivoMs(area){
  const { falhas, ultimaFalhaEm } = tentativasFalhasRecentes(area);
  const espera = tempoEsperaNecessario(falhas);
  if(espera === 0 || !ultimaFalhaEm) return 0;
  const passou = Date.now() - new Date(ultimaFalhaEm).getTime();
  const restante = espera - passou;
  return restante > 0 ? Math.ceil(restante/1000) : 0;
}
/* ---------- força da senha (aviso, não bloqueia) ---------- */
function avaliarForcaSenha(s){
  if(!s) return null;
  const fracos = ['123456','12345678','123456789','senha','password','12345','111111','abc123','qwerty','admin','000000','1234','abcdef','iloveyou','654321','senha123','12345678910'];
  if(fracos.includes(s.toLowerCase())) return 'fraca';
  if(s.length < 6) return 'fraca';
  const temLetra = /[a-zA-Z]/.test(s);
  const temNumero = /[0-9]/.test(s);
  const temEspecial = /[^a-zA-Z0-9]/.test(s);
  const variedade = [temLetra,temNumero,temEspecial].filter(Boolean).length;
  if(s.length < 8 || variedade < 2) return 'media';
  return 'forte';
}
function htmlForcaSenha(s){
  const nivel = avaliarForcaSenha(s);
  if(!nivel) return '';
  const cfg = {
    fraca: { cor:'var(--red)', texto:'🔴 Senha fraca — fácil de adivinhar' },
    media: { cor:'var(--amber)', texto:'🟡 Senha média — pode melhorar (misture letras, números e símbolos)' },
    forte: { cor:'var(--green)', texto:'🟢 Senha forte' }
  }[nivel];
  return `<div style="font-size:12px; font-weight:700; color:${cfg.cor}; margin-top:6px;">${cfg.texto}</div>`;
}

function fmtDataHora(isoCompleto){

  const dt = new Date(isoCompleto);
  if(isNaN(dt.getTime())) return '—';
  const d = String(dt.getDate()).padStart(2,'0');
  const m = String(dt.getMonth()+1).padStart(2,'0');
  const y = dt.getFullYear();
  const hh = String(dt.getHours()).padStart(2,'0');
  const mm = String(dt.getMinutes()).padStart(2,'0');
  return `${d}/${m}/${y} ${hh}:${mm}`;
}
function isoParaDatetimeLocal(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '';
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function datetimeLocalParaIso(val){
  if(!val) return '';
  const d = new Date(val);
  if(isNaN(d.getTime())) return '';
  return d.toISOString();
}
function comprimirImagem(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Falha ao ler o arquivo'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Falha ao carregar a imagem'));
      img.onload = () => {
        const MAX = 900;
        let { width, height } = img;
        if(width > height && width > MAX){ height = Math.round(height * MAX / width); width = MAX; }
        else if(height > MAX){ width = Math.round(width * MAX / height); height = MAX; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

  try{ localStorage.setItem(chatLastSeenKey(role, chamadoId), new Date().toISOString()); }catch(e){}

function temMensagemNaoLida(c, role){
  if(!c || !Array.isArray(c.mensagens) || c.mensagens.length === 0) return false;
  let lastSeen = null;
  try{ lastSeen = localStorage.getItem(chatLastSeenKey(role, c.id)); }catch(e){}

function mascaraDataBR(el){
  let v = el.value.replace(/\D/g,'').slice(0,8);
  if(v.length >= 5) v = v.slice(0,2) + '/' + v.slice(2,4) + '/' + v.slice(4);
  else if(v.length >= 3) v = v.slice(0,2) + '/' + v.slice(2);
  el.value = v;
}
function dataBRparaISO(str){
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec((str||'').trim());
  if(!m) return null;
  const [, d, mo, y] = m;
  const dt = new Date(`${y}-${mo}-${d}T00:00:00`);
  if(isNaN(dt.getTime()) || dt.getDate() !== parseInt(d,10) || (dt.getMonth()+1) !== parseInt(mo,10)) return null;
  return `${y}-${mo}-${d}`;
}

function opcoesDatalist(termo){
  const t = (termo||'').trim().toUpperCase();
  if(!t) return ''; // campo vazio: nenhuma sugestão, evita despejar o catálogo inteiro
  const LIMITE = 30;
  const match = Object.keys(state.produtos)
    .filter(c => c.includes(t) || state.produtos[c].nome.toUpperCase().includes(t))
    .slice(0, LIMITE);
  return match.map(c=>`<option value="${esc(c)}">${esc(state.produtos[c].nome)}</option>`).join('');
}

async function submitChamado(){
  const nome = (document.getElementById('fNome').value || '').trim().slice(0,100);
  const setor = (document.getElementById('fSetor').value || '').trim().toUpperCase();
  const descricao = (document.getElementById('fDescricao').value || '').trim().slice(0,500);
  const prio = document.getElementById('fPrio').value;
  const dataBR = document.getElementById('fData').value;
  const data = dataBRparaISO(dataBR);

  if(!nome || !setor || !dataBR){ toast('Preencha nome, setor e data.'); return; }
  if(!SETORES_VALIDOS.includes(setor)){ toast('Selecione um setor válido da lista.'); return; }
  if(!data){ toast('Data inválida. Use o formato dd/mm/aaaa.'); return; }
  const hojeISO = new Date().toISOString().slice(0,10);
  if(data < hojeISO){ toast('A data não pode ser anterior a hoje.'); return; }
  const itensValidos = state.formItems
    .map(it => ({ codigo: it.codigo.trim().toUpperCase().slice(0,40), quantidade: it.quantidade }))
    .filter(it => it.codigo && it.quantidade);
  if(itensValidos.length === 0){ toast('Adicione ao menos um item com código e quantidade.'); return; }

  const itensFinal = itensValidos.map(it => {
    const prod = state.produtos[it.codigo];
    return { codigo: it.codigo, material: prod ? prod.nome : '(código não cadastrado)', unidade: (prod && prod.unidade) || '', quantidade: it.quantidade };
  });

  const chamado = {
    id: proximoCodigo(),
    nome, setor, prioridade: prio, dataNecessaria: data,
    itens: itensFinal,
    descricao,
    status: 'Novo',
    criadoEm: new Date().toISOString(),
    historico: [{ status:'Novo', em: new Date().toISOString() }],
    mensagens: [],
    fotos: [],
    fixado: false,
    notaInterna: '',
    avaliacao: null
  };

  const btn = document.getElementById('enviarBtn');

  state.formItems = [{ codigo:'', quantidade:'' }];

/* ---------- cookies (usado só pro "manter conectado") ---------- */
function setCookie(nome, valor, dias){
  const exp = new Date(Date.now() + dias*24*60*60*1000).toUTCString();
  document.cookie = `${nome}=${encodeURIComponent(valor)}; expires=${exp}; path=/; SameSite=Strict`;
}
function getCookie(nome){
  const alvo = nome + '=';
  const partes = document.cookie.split(';').map(s => s.trim());
  for(const p of partes){ if(p.startsWith(alvo)) return decodeURIComponent(p.slice(alvo.length)); }
  return null;
}
function apagarCookie(nome){
  document.cookie = `${nome}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; SameSite=Strict`;
}
function sairDaLogistica(){
  apagarCookie('apisflora_conectado');
  state.screen = 'estoque-login';
  state.configUnlocked = false;
  render();
  toast('Você saiu da área de Logística.');
}
function renderEstoqueLogin(app){
  app.innerHTML = `
    <div class="login-box panel">
      <h2 class="section-title" style="text-align:center;">Acesso — Estoque / Logística</h2>
      <p class="section-sub" style="text-align:center;">Digite a senha para ver e gerenciar os chamados.</p>
      <div class="field">
        <label>Senha</label>
        <input type="password" id="fSenha" placeholder="••••••••">
      </div>
      <label style="display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; margin:-6px 0 4px; cursor:pointer;">
        <input type="checkbox" id="manterConectado" style="width:16px; height:16px;">
        Manter conectado neste aparelho por 7 dias
      </label>
      <div id="loginErr" class="error-msg" style="display:none;">Senha incorreta.</div>
      <button class="btn btn-primary" id="entrarBtn" style="width:100%; margin-top:8px;">Entrar</button>
    </div>
  `;
  const senhaInput = document.getElementById('fSenha');
  const entrarBtn = document.getElementById('entrarBtn');
  const errEl = document.getElementById('loginErr');
  let travaInterval = null;
  const checarTrava = () => {
    const restante = bloqueioAtivoMs('Login Logística');
    if(restante > 0){
      entrarBtn.disabled = true;
      errEl.style.display = 'block';
      errEl.textContent = `Muitas tentativas erradas. Aguarde ${restante}s para tentar de novo.`;
      clearTimeout(travaInterval);
      travaInterval = setTimeout(checarTrava, 1000);
      return true;
    }
    entrarBtn.disabled = false;
    clearTimeout(travaInterval);
    return false;
  };
  checarTrava();
  const tryLogin = async () => {
    if(checarTrava()) return;
    if(await sha256Hex(senhaInput.value) === state.senhaEstoque){
      if(document.getElementById('manterConectado').checked){
        setCookie('apisflora_conectado', '1', 7);
      }
      await registrarAcesso('Login Logística', true);
      state.estoqueTab = 'painel';
      state.screen = 'estoque';
      render();
    } else {
      await registrarAcesso('Login Logística', false);
      if(!checarTrava()){
        errEl.style.display = 'block';
        errEl.textContent = 'Senha incorreta.';
      }
    }
  };
  document.getElementById('entrarBtn').onclick = tryLogin;
  senhaInput.onkeydown = e => { if(e.key === 'Enter') tryLogin(); };
  senhaInput.focus();
}

function renderTable(){
  const tw = document.getElementById('tableWrap');
  const busca = state.filtro.busca.trim().toLowerCase();
  let list = state.chamados.filter(c => {
    if(state.filtro.status !== 'todos' && c.status !== state.filtro.status) return false;
    if(state.filtro.prioridade !== 'todas' && c.prioridade !== state.filtro.prioridade) return false;
    if(busca){
      const hay = (c.id + ' ' + c.setor + ' ' + c.nome + ' ' + c.itens.map(i=>i.codigo+' '+i.material).join(' ')).toLowerCase();
      if(!hay.includes(busca)) return false;
    }
    return true;
  });
  list = list.map((c,i) => ({c,i})).sort((a,b) => (b.c.fixado?1:0) - (a.c.fixado?1:0) || a.i - b.i).map(x=>x.c);

  // remove da seleção ids que não existem mais (excluídos por outro dispositivo, etc.)
  const idsExistentes = new Set(state.chamados.map(c=>c.id));
  Array.from(state.selecionados).forEach(id => { if(!idsExistentes.has(id)) state.selecionados.delete(id); });

  if(list.length === 0){
    tw.innerHTML = `<div class="empty-state">Nenhum chamado encontrado com esses filtros.</div>`;
    renderBulkBar(list);
    return;
  }

  tw.innerHTML = `
    <table>
      <thead><tr>
        <th style="width:30px;"><input type="checkbox" id="selecionarTodos" title="Selecionar todos os chamados visíveis"></th>
        <th>Chamado</th><th>Chat</th><th>Solicitante / Setor</th><th>Itens</th><th>Prioridade</th><th>Entrega</th><th>Status</th><th>Ações</th>
      </tr></thead>
      <tbody>
        ${list.map(c => {
          const atrasado = isAtrasado(c);
          const temFotos = Array.isArray(c.fotos) && c.fotos.length > 0;

              </div>
              <div class="acoes-pop" id="pop-${c.id}" style="display:none;">
                ${temFotos ? `<button data-trocar="${c.id}">➕ Adicionar foto</button>` : ''}

  `;
  let pendingEntregaId = null;
  let pendingTrocaFotoId = null;
  const fotoInput = document.getElementById('fotoEntregaInput');
  const trocarFotoInput = document.getElementById('trocarFotoInput');
  tw.querySelectorAll('.status-select').forEach(sel=>{
    sel.onchange = async e => {
      const c = state.chamados.find(x=>x.id === e.target.dataset.id);
      const novoStatus = e.target.value;
      if(novoStatus === 'Entregue'){
        e.target.value = c.status; // só confirma visualmente depois da foto
        pendingEntregaId = c.id;
        fotoInput.click();
        return;
      }
      if(novoStatus === 'Cancelado'){
        const motivo = prompt(`Por que o chamado ${c.id} está sendo cancelado? (obrigatório)`);
        if(motivo === null){ e.target.value = c.status; return; } // desistiu
        const motivoLimpo = motivo.trim().slice(0,300);
        if(!motivoLimpo){ e.target.value = c.status; toast('Cancelamento precisa de um motivo.'); return; }
        c.motivoCancelamento = motivoLimpo;
      }
      c.status = novoStatus;
      c.historico.push({ status: c.status, em: new Date().toISOString() });
      await saveChamados();
      toast(`Chamado ${c.id} → ${c.status}`);
      renderEstoque(document.getElementById('app'));
    };
  });
  fotoInput.onchange = async e => {
    const file = e.target.files[0];
    e.target.value = '';
    if(!file || !pendingEntregaId) return;
    const c = state.chamados.find(x=>x.id === pendingEntregaId);
    pendingEntregaId = null;
    if(!c) return;
    toast('Enviando foto…');
    try{
      const dataUrl = await comprimirImagem(file);
      c.status = 'Entregue';
      c.fotos = c.fotos || [];
      c.fotos.push(dataUrl);
      c.entregueEm = new Date().toISOString();
      c.historico.push({ status:'Entregue', em: c.entregueEm });
      await saveChamados();
      toast(`Chamado ${c.id} → Entregue`);
      renderEstoque(document.getElementById('app'));
    }catch(err){
      toast('Não consegui processar a foto. Tente novamente.');
    }
  };
  trocarFotoInput.onchange = async e => {
    const file = e.target.files[0];
    e.target.value = '';
    if(!file || !pendingTrocaFotoId) return;
    const c = state.chamados.find(x=>x.id === pendingTrocaFotoId);
    pendingTrocaFotoId = null;
    if(!c) return;
    toast('Enviando nova foto…');
    try{
      c.fotos = c.fotos || [];
      c.fotos.push(await comprimirImagem(file));
      await saveChamados();
      toast(`Foto adicionada ao chamado ${c.id}. Total: ${c.fotos.length}.`);
      renderEstoque(document.getElementById('app'));
    }catch(err){
      toast('Não consegui processar a foto. Tente novamente.');
    }
  };
  tw.querySelectorAll('[data-pin]').forEach(btn=>{
    btn.onclick = async e => {
      const id = e.target.dataset.pin;
      const c = state.chamados.find(x=>x.id === id);
      if(!c) return;
      c.fixado = !c.fixado;
      await saveChamados();
      toast(c.fixado ? `Chamado ${id} fixado no topo.` : `Chamado ${id} desfixado.`);
      renderEstoque(document.getElementById('app'));
    };
  });
  tw.querySelectorAll('[data-chat]').forEach(btn=>{
    btn.onclick = () => abrirChat(btn.dataset.chat, 'logistica');
  });
  tw.querySelectorAll('[data-abrir]').forEach(btn=>{
    btn.onclick = e => {
      state.detalheChamadoId = e.target.dataset.abrir;
      state.screen = 'estoque-detalhe';
      render();
    };
  });
  tw.querySelectorAll('[data-menu]').forEach(btn=>{
    btn.onclick = e => {
      const id = e.target.dataset.menu;
      tw.querySelectorAll('.acoes-pop').forEach(p => { if(p.id !== `pop-${id}`) p.style.display = 'none'; });
      const pop = document.getElementById(`pop-${id}`);
      pop.style.display = pop.style.display === 'none' ? 'flex' : 'none';
    };
  });
  tw.querySelectorAll('[data-trocar]').forEach(btn=>{
    btn.onclick = async e => {
      const id = e.target.dataset.trocar;
      const senha = prompt('Digite a senha para trocar a foto desse chamado:');
      if(senha === null) return;
      if(await sha256Hex(senha) !== state.senhaExcluir){ toast('Senha incorreta.'); registrarAcesso(`Trocar foto (${id})`, false); return; }
      pendingTrocaFotoId = id;
      trocarFotoInput.click();
    };
  });
  tw.querySelectorAll('[data-delchamado]').forEach(btn=>{
    btn.onclick = async e => {
      const id = e.target.dataset.delchamado;
      const senha = prompt(`Digite a senha para excluir o chamado ${id}:`);
      if(senha === null) return;
      if(await sha256Hex(senha) !== state.senhaExcluir){ toast('Senha incorreta. Chamado não excluído.'); await registrarAcesso(`Excluir chamado (${id})`, false); return; }
      if(!confirm(`Excluir o chamado ${id}? Essa ação não pode ser desfeita.`)) return;
      state.chamados = state.chamados.filter(x => x.id !== id);
      state.selecionados.delete(id);
      await saveChamados();
      toast(`Chamado ${id} excluído.`);
      renderEstoque(document.getElementById('app'));
    };
  });

  const selTodos = document.getElementById('selecionarTodos');
  atualizarEstadoSelecaoTodos(list);
  selTodos.onchange = () => {
    if(selTodos.checked){ list.forEach(c => state.selecionados.add(c.id)); }
    else { list.forEach(c => state.selecionados.delete(c.id)); }
    renderTable();
  };
  tw.querySelectorAll('.chk-linha').forEach(chk=>{
    chk.onchange = () => {
      const id = chk.dataset.id;
      if(chk.checked) state.selecionados.add(id); else state.selecionados.delete(id);
      atualizarEstadoSelecaoTodos(list);
      renderBulkBar(list);
    };
  });
  renderBulkBar(list);
}
function atualizarEstadoSelecaoTodos(list){
  const el = document.getElementById('selecionarTodos');
  if(!el) return;
  const todos = list.length > 0 && list.every(c => state.selecionados.has(c.id));
  const alguns = list.some(c => state.selecionados.has(c.id));
  el.checked = todos;
  el.indeterminate = alguns && !todos;
}
function renderBulkBar(list){
  const bar = document.getElementById('bulkBar');
  if(!bar) return;
  const qtd = state.selecionados.size;
  if(qtd === 0){ bar.innerHTML = ''; return; }
  const STATUS_LOTE = STATUS_LIST.filter(s => s !== 'Entregue' && s !== 'Cancelado');
  bar.innerHTML = `
    <div class="bulk-bar">
      <span class="bulk-count">✅ ${qtd} chamado${qtd>1?'s':''} selecionado${qtd>1?'s':''}</span>
      <select id="bulkStatus">
        <option value="">Mudar status para…</option>
        ${STATUS_LOTE.map(s=>`<option value="${s}">${s}</option>`).join('')}
      </select>
      <button class="btn btn-primary" id="bulkAplicarBtn" disabled>Aplicar</button>
      <button class="btn btn-ghost" id="bulkLimparBtn">Cancelar seleção</button>
      <span class="bulk-hint">Entregue e Cancelado exigem foto/motivo individual em cada chamado.</span>
    </div>
  `;
  const sel = document.getElementById('bulkStatus');
  const aplicarBtn = document.getElementById('bulkAplicarBtn');
  sel.onchange = () => { aplicarBtn.disabled = !sel.value; };
  aplicarBtn.onclick = async () => {
    const novoStatus = sel.value;
    if(!novoStatus) return;
    const idsAlvo = Array.from(state.selecionados);
    if(!confirm(`Mudar o status de ${idsAlvo.length} chamado(s) para "${novoStatus}"?`)) return;
    const agora = new Date().toISOString();
    let alterados = 0;
    state.chamados.forEach(c => {
      if(state.selecionados.has(c.id)){
        c.status = novoStatus;
        c.historico = c.historico || [];
        c.historico.push({ status: novoStatus, em: agora });
        alterados++;
      }
    });
    aplicarBtn.disabled = true; aplicarBtn.textContent = 'Aplicando…';
    await saveChamados();
    toast(`${alterados} chamado(s) atualizados para "${novoStatus}".`);
    state.selecionados.clear();
    renderEstoque(document.getElementById('app'));
  };
  document.getElementById('bulkLimparBtn').onclick = () => {
    state.selecionados.clear();
    renderEstoque(document.getElementById('app'));
  };
}

function normalizeHeader(h){
  return String(h||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();
}

async function handleImportPlanilha(file, containerId){
  try{
    toast('Lendo planilha…');
    await carregarXLSX();
  }catch(e){ toast(e.message); return; }
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' });
    if(!rows || rows.length < 2){ toast('Planilha vazia ou sem dados.'); return; }

    const headers = rows[0].map(normalizeHeader);
    let idxCodigo = headers.findIndex(h => h.includes('codigo') || h === 'cod' || h.includes('nº') || h.includes('numero'));
    if(idxCodigo === -1){
      idxCodigo = headers.findIndex(h => h.includes('item') && !h.includes('descri') && !h.includes('nome'));
    }
    const idxNome = headers.findIndex(h => h.includes('nome') || h.includes('produto') || h.includes('material') || h.includes('descricao'));
    const idxUnidade = headers.findIndex(h => h.includes('unidade') || h === 'un' || h === 'uni' || h.includes('medida'));

    if(idxCodigo === -1 || idxNome === -1){
      toast('Não encontrei colunas de código e nome na planilha.');
      return;
    }

    let count = 0;
    for(let i=1; i<rows.length; i++){
      const row = rows[i];
      const codigo = String(row[idxCodigo] ?? '').trim().toUpperCase();
      const nome = String(row[idxNome] ?? '').trim();
      const unidade = idxUnidade >= 0 ? String(row[idxUnidade] ?? '').trim() : '';
      if(!codigo || !nome) continue;
      state.produtos[codigo] = { nome, unidade };
      count++;
    }
    await saveProdutos();
    toast(`${count} produto${count===1?'':'s'} importado${count===1?'':'s'}.`);
    renderProdutosTab(containerId);
  }catch(err){
    toast('Não consegui ler essa planilha. Confira o arquivo.');
  }
}

function filtrarChamadosPorPeriodo(lista){
  const f = state.filtroDados;
  if(!f || f.periodo === 'todos') return lista;
  if(f.periodo === 'semana'){
    const inicio = new Date(); inicio.setDate(inicio.getDate()-6); inicio.setHours(0,0,0,0);
    return lista.filter(c => c.criadoEm && new Date(c.criadoEm) >= inicio);
  }
  if(f.periodo === 'mes'){
    const agora = new Date();
    const inicio = new Date(agora.getFullYear(), agora.getMonth(), 1, 0,0,0,0);
    return lista.filter(c => c.criadoEm && new Date(c.criadoEm) >= inicio);
  }
  if(f.periodo === 'personalizado'){
    return lista.filter(c => {
      if(!c.criadoEm) return false;
      const d = c.criadoEm.slice(0,10);
      if(f.de && d < f.de) return false;
      if(f.ate && d > f.ate) return false;
      return true;
    });
  }
  return lista;
}
function periodoLabel(){
  const f = state.filtroDados;
  if(f.periodo === 'semana') return 'Esta semana';
  if(f.periodo === 'mes') return 'Este mês';
  if(f.periodo === 'personalizado') return `${f.de ? fmtData(f.de) : '…'} até ${f.ate ? fmtData(f.ate) : '…'}`;
  return 'Todos os períodos';
}

    porDiaSemana[d.getDay()]++;
    const h = d.getHours();
    const periodo = porPeriodo.find(p => h >= p.de && h < p.ate);
    if(periodo) periodo.qtd++;

async function calcularHashArquivo(){
  try{
    const scripts = document.querySelectorAll('script:not([src])');
    const ultimo = scripts[scripts.length - 1];
    const texto = ultimo ? ultimo.textContent : '';
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(texto));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }catch(e){ return null; }
}

      return;
    }
    state.manutencao = { ativo, inicio, fim, mensagem };
    await db.set('manutencao', JSON.stringify(state.manutencao), true);
    toast(ativo ? 'Aviso de manutenção ativado.' : 'Aviso de manutenção salvo (desativado).');
    atualizarBannerManutencao();
  };
  document.getElementById('calcularHashBtn').onclick = async () => {
    const resultEl = document.getElementById('hashResultado');
    resultEl.textContent = 'Calculando…';
    const hash = await calcularHashArquivo();
    resultEl.textContent = hash ? `SHA-256: ${hash}` : 'Não consegui calcular (navegador sem suporte a crypto.subtle).';
  };
  renderProdutosTab('produtosSection');
}

/* ---------------- logout automático por inatividade (5 min, área de Logística) ---------------- */
const LIMITE_INATIVIDADE_MS = 5 * 60 * 1000;
let ultimaAtividade = Date.now();
['click','keydown','mousemove','touchstart','scroll'].forEach(ev => {
  document.addEventListener(ev, () => { ultimaAtividade = Date.now(); }, { passive:true });
});
setInterval(() => {
  if(state.screen !== 'estoque') return;
  if(Date.now() - ultimaAtividade < LIMITE_INATIVIDADE_MS) return;
  if(state.chatAberto) fecharChat();
  apagarCookie('apisflora_conectado');
  state.screen = 'estoque-login';
  state.configUnlocked = false;
  ultimaAtividade = Date.now();
  render();
  toast('Sessão encerrada por inatividade (5 min).');
}, 15000);

/* ---------------- init ---------------- */
(async function init(){
  iniciarTema();
  await firebaseAuthPronto; // espera o login anônimo (se houver Firebase) antes de tocar no banco
  await loadData();
  capturarSnapshotChamados(); // marca o "ponto de partida", pra só notificar mudanças depois disso
  render();
  iniciarListenerChamados();
  setTimeout(checarVersaoNova, 800); // checa bem cedo, sem atrasar o primeiro desenho da tela
  setInterval(checarVersaoNova, 2 * 60 * 1000); // a cada 2 min, pra quem deixa a aba aberta o dia todo
  // registra o service worker de "nunca guardar cache" SE o arquivo sw.js estiver publicado
  // junto (na mesma pasta). Se não estiver, isso simplesmente falha em silêncio — não quebra nada.
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
})();
</script>
